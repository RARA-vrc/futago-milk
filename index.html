<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ふたごミルク帳</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ミルク帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: two side-by-side baby cards (stacked on phones) → timeline → weight chart. Large tap targets for night use. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #F7F8FA;
  --ink: #1B2230;
  --muted: #5D687A;
  --line: #DDE2EA;
  --ane: #C94A6E;
  --ane-soft: #FBE7ED;
  --imo: #23808A;
  --imo-soft: #DDF0F1;
  --danger: #C2362B;
  --danger-soft: #FCE6E3;
  --warn: #9A6A12;
  --warn-soft: #FBF0D9;
  --scrim: rgba(20, 26, 38, .45);
  --band: rgba(35, 128, 138, .10);
  --band-2: rgba(35, 128, 138, .16);
  --f-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #161D28; --surface-2: #1B2431; --ink: #E4E9F0; --muted: #94A0B2; --line: #283244;
    --ane: #EE8CA8; --ane-soft: #3A1F29; --imo: #5DC2C9; --imo-soft: #15302F;
    --danger: #FF8A7D; --danger-soft: #3D1C19; --warn: #E8BC62; --warn-soft: #33290F; --scrim: rgba(0,0,0,.6);
    --band: rgba(93, 194, 201, .10); --band-2: rgba(93, 194, 201, .17);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #161D28; --surface-2: #1B2431; --ink: #E4E9F0; --muted: #94A0B2; --line: #283244;
  --ane: #EE8CA8; --ane-soft: #3A1F29; --imo: #5DC2C9; --imo-soft: #15302F;
  --danger: #FF8A7D; --danger-soft: #3D1C19; --warn: #E8BC62; --warn-soft: #33290F; --scrim: rgba(0,0,0,.6);
  --band: rgba(93, 194, 201, .10); --band-2: rgba(93, 194, 201, .17);
  color-scheme: dark;
}

/* Traditional Chinese needs glyphs the Japanese faces lack, so zh uses one Taiwanese face throughout. */
:root[lang^="zh"] {
  --f-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
/* This is an app, not a document: quick repeated taps (time buttons, ±10) must never zoom the page.
   touch-action stops iOS double-tap zoom; 16px+ fields stop Safari's zoom-on-focus. */
html, body, button, a, input, select, label { touch-action: manipulation; }
input, select, textarea { font-size: max(16px, 1em); }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--imo) 60%, transparent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 1060px; margin: 0 auto;
  padding-block: 16px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.top h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .02em; }
.top-right { display: flex; align-items: center; gap: 8px; }
.clock { font-family: var(--f-display); font-size: 1.35rem; font-weight: 700; margin-right: 2px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 40px; padding: 0 12px; font-size: .88rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; min-height: 40px; padding: 0 12px; font-size: .82rem; font-weight: 700; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); color: var(--warn); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.on { border-color: color-mix(in srgb, var(--imo) 45%, transparent); background: var(--imo-soft); color: var(--imo); }

/* tabs: a bottom bar on phones, a segmented row on wide screens */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs button { border: none; background: transparent; color: var(--muted); font-family: var(--f-display); font-weight: 700; font-size: .95rem; min-height: 44px; border-radius: 10px; }
.tabs button[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
@media (min-width: 760px) {
  .tabs { max-width: 520px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
}
@media (max-width: 759px) {
  .app { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(12px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  .tabs button { min-height: 50px; font-size: 1rem; }
  .tabs button[aria-current="page"] { background: var(--surface-2); box-shadow: none; }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)) !important; }
}
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 44px; padding: 0 16px; font-weight: 700; }
.btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: transparent; }

/* baby cards */
.babies { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.card { --c: var(--ane); --cs: var(--ane-soft); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.card[data-baby="imouto"] { --c: var(--imo); --cs: var(--imo-soft); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; background: var(--cs); }
.card-head h2 { margin: 0; font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; color: var(--c); }
.next-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.next .rule { display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent; padding: 2px 0; min-height: 32px; color: var(--muted); font-size: .8rem; }
.next .rule span { color: var(--c); font-weight: 700; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 99px; padding: 0 8px; font-size: .75rem; }
.next .rule:hover span { background: var(--cs); }
.last-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
.last-row .cd-sub { margin: 0; min-width: 0; }
.weight { text-align: right; }
.weight b { font-family: var(--f-display); font-size: 1.15rem; }
.weight small { display: block; color: var(--muted); font-size: .75rem; line-height: 1.3; }

.next { padding: 12px 18px 4px; }
.next .label { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
.cd { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; line-height: 1.2; margin-top: 2px; min-height: 2.6rem; display: flex; align-items: baseline; gap: 2px; flex-wrap: wrap; }
.cd b { font-size: 2.5rem; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.cd { align-items: baseline; gap: 4px 10px; }
.cd small { font-size: .8rem; color: var(--muted); align-self: center; }
.cd-rel { font-size: 1rem; color: var(--muted); font-weight: 700; }
.cd.due { color: var(--danger); }
.cd.due .cd-rel { color: var(--danger); }
.next-preview { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: .92rem; }
.next-preview b { font-family: var(--f-display); font-size: 1.3rem; }
.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; }
.steps b { font-family: var(--f-display); }
.steps code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-family: ui-monospace, monospace; }
.cd.empty { font-size: .95rem; font-weight: 500; color: var(--muted); font-family: var(--f-body); min-height: 2.6rem; align-items: center; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 8px; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 99px; transition: width .6s; }
.bar.due i { background: var(--danger); }
.cd-sub { color: var(--muted); font-size: .85rem; margin-top: 6px; }

.actions { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 14px 18px 14px; }
.actions.has-timer { grid-template-columns: 1fr 5.6rem; }
.actions .milk { background: var(--c); color: var(--surface); border: none; border-radius: 14px; min-height: 56px; font-family: var(--f-display); font-size: 1.1rem; font-weight: 700; }
.actions .timer { border-radius: 14px; min-height: 56px; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); background: var(--cs); color: var(--c); font-weight: 700; font-size: .78rem; line-height: 1.25; }
.actions .timer small { display: block; font-size: .7rem; opacity: .85; }
.actions .subs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.actions .subs .sub { font-size: .9rem; padding: 0 2px; }
.temp.warm { color: var(--warn); font-weight: 700; }
.temp.hot { color: var(--danger); font-weight: 700; }
.actions .sub { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; min-height: 48px; font-weight: 700; }
.actions .sub:hover, .actions .milk:hover, .actions .timer:hover { filter: brightness(1.05); }

.today { margin-top: auto; padding: 10px 18px 12px; border-top: 1px solid var(--line); font-size: .84rem; color: var(--muted); }
.today .lbl { font-weight: 700; color: var(--ink); margin-right: 6px; }
.today b { color: var(--ink); font-family: var(--f-display); font-size: 1rem; }

/* sections */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 8px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: none; background: transparent; border-radius: 9px; min-height: 36px; padding: 0 12px; font-size: .88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.day { margin-top: 10px; }
.day-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 8px 0 6px; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 1; }
.day-head h3 { margin: 0; font-family: var(--f-display); font-size: 1rem; }
.day-head .sum { font-size: .78rem; color: var(--muted); }
.day-head .sum em { font-style: normal; font-weight: 700; }
.day-head .sum em.ane { color: var(--ane); }
.day-head .sum em.imouto { color: var(--imo); }
.items { list-style: none; margin: 0; padding: 0; }
.item { width: 100%; display: grid; grid-template-columns: 3.4rem 2.6rem 4.6rem 1fr auto; align-items: center; gap: 8px; text-align: left; border: none; border-bottom: 1px solid var(--line); background: transparent; padding: 9px 2px; min-height: 46px; }
.item:hover { background: var(--surface-2); }
.item .t { font-weight: 700; }
.chip { display: inline-block; text-align: center; border-radius: 99px; font-size: .78rem; font-weight: 700; padding: 1px 0; }
.chip.ane { background: var(--ane-soft); color: var(--ane); }
.chip.imouto { background: var(--imo-soft); color: var(--imo); }
.item .k { font-size: .85rem; color: var(--muted); }
.item .d { min-width: 0; overflow-wrap: anywhere; }
.item .d small { color: var(--muted); margin-left: 6px; }
.pale-flag { color: var(--danger); font-weight: 700; }
.empty-note { color: var(--muted); padding: 18px 0 6px; }
.more { margin-top: 12px; }

.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; width: 100%; min-width: 480px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

.legend { margin-bottom: 4px; }
.w-btn { border: none; border-radius: 12px; min-height: 44px; padding: 0 14px; font-weight: 700; color: var(--surface); }
.w-btn.ane { background: var(--ane); }
.w-btn.imouto { background: var(--imo); }
.wtables { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px 20px; margin-top: 12px; }
.wtable { min-width: 0; }
.wtable h3 { margin: 0 0 4px; font-family: var(--f-display); font-size: .95rem; }
.wtable h3.ane { color: var(--ane); }
.wtable h3.imouto { color: var(--imo); }
.wrow { width: 100%; display: grid; grid-template-columns: 1fr 4.6rem 4rem 4.6rem; gap: 6px; align-items: center; text-align: right; border: none; border-bottom: 1px solid var(--line); background: transparent; padding: 8px 2px; min-height: 42px; font-size: .88rem; }
.wrow:hover { background: var(--surface-2); }
.wrow > :first-child { text-align: left; color: var(--muted); }
.wrow.head { font-size: .72rem; color: var(--muted); letter-spacing: .04em; min-height: 0; padding-block: 4px; }
.wrow .up { color: var(--imo); font-weight: 700; }
.wrow .down { color: var(--danger); font-weight: 700; }
.foot { color: var(--muted); font-size: .8rem; text-align: center; }
.foot p { margin: 2px 0; }

/* sheet (record form) */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 20px; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-size: 1.25rem; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-size: .8rem; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.field input[type="text"], .field input[type="number"], .field input[type="datetime-local"], .field select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; min-height: 46px; padding: 0 12px; width: 100%; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: center; }
.stepper input { text-align: center; font-family: var(--f-display); font-size: 1.5rem !important; font-weight: 700; }
.mlsel { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; min-height: 46px; padding: 0 10px; width: 100%; min-width: 0; font-family: var(--f-display); font-weight: 700; font-size: 1rem; color: var(--ink); }
.stepper .mlsel { font-size: 1.4rem; text-align: center; text-align-last: center; }
.brow .mlsel { padding: 0 4px 0 8px; font-size: 1.05rem; }
.stepper button { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; min-height: 36px; padding: 0 14px; font-size: .88rem; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.who button[data-baby="ane"][aria-pressed="true"] { background: var(--ane); border-color: var(--ane); color: var(--surface); }
.who button[data-baby="imouto"][aria-pressed="true"] { background: var(--imo); border-color: var(--imo); color: var(--surface); }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }
.caution { font-size: .85rem; background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 8px 12px; margin: 0; }
.check { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.check input { width: 20px; height: 20px; }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
.sheet-actions .spacer { flex: 1; }
.sheet-actions .btn.solid { min-width: 120px; }
.settings-baby { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.settings-baby h3 { grid-column: 1 / -1; margin: 0; font-family: var(--f-display); font-size: 1rem; }
.settings-baby .field.wide { grid-column: 1 / -1; }

/* alarm ringing */
.ring { position: fixed; inset: 0; z-index: 40; background: var(--danger); color: #fff; display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.ring-inner { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
.ring-item { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.ring-item h2 { margin: 0; font-family: var(--f-display); font-size: 1.8rem; line-height: 1.3; }
.ring-item p { margin: 0; opacity: .92; }
.ring-item .row button { flex: 1 1 140px; min-height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,.6); background: transparent; color: #fff; font-weight: 700; }
.ring-item .row button.primary { background: #fff; color: #9B1C14; border-color: #fff; }
@media (prefers-reduced-motion: no-preference) {
  .ring { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { background: #8E1F17; } }
}

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 12px; z-index: 50; font-size: .9rem; width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 12px; }
.toast span { padding-block: 4px; }
.toast-btn { flex: none; border: 1px solid color-mix(in srgb, var(--bg) 50%, transparent); background: transparent; color: var(--bg); border-radius: 10px; min-height: 40px; padding: 0 14px; font-weight: 700; }
.fix-last { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; font-size: .78rem; font-weight: 700; padding: 0 12px; min-height: 34px; }
.item .fix { font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
/* feeding timetable: time | 姉 | 妹, one row per time so the twins read side by side */
.plan-head, .plan-row { display: grid; grid-template-columns: 4.4rem 1fr 1fr; gap: 8px; align-items: stretch; }
.plan-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1; background: var(--surface); padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
.plan-head div { font-family: var(--f-display); font-weight: 700; }
.plan-head .ane { color: var(--ane); }
.plan-head .imouto { color: var(--imo); }
.plan-head small { display: block; font-family: var(--f-body); font-weight: 400; font-size: .74rem; color: var(--muted); }
.plan-row { padding: 5px 0; }
.plan-row .pt { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }

  const HOUR = 3600e3, MIN = 60e3, DAY = 86400e3;

  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const p2 = n => String(n).padStart(2, '0');
  const fmtT = ms => { const d = new Date(ms); return `${d.getHours()}:${p2(d.getMinutes())}`; };

  const startOfDay = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
  function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }

  // Every visible string is written as L(japanese, chinese) next to where it is used.
  let LANG = ['ja', 'zh'].includes(lsGet('futago-lang', '')) ? lsGet('futago-lang', '') : (/^zh/i.test(navigator.language || '') ? 'zh' : 'ja');
  const L = (ja, zh) => LANG === 'zh' ? zh : ja;
  let KIND, POO_COLOR, POO_AMT, TYPE_LABEL, SYMPTOMS;
  function setLabels() {
    KIND = { formula: L('ミルク', '配方奶'), expressed: L('搾母乳', '擠出母乳'), breast: L('母乳', '親餵') };
    POO_COLOR = { yellow: L('黄色', '黃色'), green: L('緑', '綠色'), brown: L('茶色', '褐色'), pale: L('白っぽい', '偏白') };
    POO_AMT = { small: L('少なめ', '少'), normal: L('ふつう', '普通'), large: L('多め', '多') };
    TYPE_LABEL = { milk: L('授乳', '餵奶'), pee: L('おしっこ', '尿尿'), poo: L('うんち', '便便'), weight: L('体重', '體重'), measure: L('身長・頭囲', '身長・頭圍'), temp: L('体温・体調', '體溫・身體狀況') };
    SYMPTOMS = {
      runny: L('鼻水', '流鼻水'), cough: L('咳', '咳嗽'), vomit: L('吐いた', '嘔吐'), diarrhea: L('下痢', '腹瀉'),
      rash: L('発疹', '起疹子'), fussy: L('機嫌が悪い', '哭鬧不安'), poorfeed: L('飲みが悪い', '喝奶量少'), breath: L('息が苦しそう', '呼吸急促'),
      medicine: L('薬を飲んだ', '吃了藥'), doctor: L('受診した', '去看醫生'),
    };
  }
  setLabels();
  // Static HTML carries its Chinese in data-zh / data-zh-aria; the Japanese original is kept in data-ja.
  function applyLang() {
    document.documentElement.lang = L('ja', 'zh-Hant-TW');
    document.querySelectorAll('[data-zh]').forEach(el => {
      if (el.dataset.ja === undefined) el.dataset.ja = el.textContent;
      el.textContent = L(el.dataset.ja, el.dataset.zh);
    });
    document.querySelectorAll('[data-zh-aria]').forEach(el => {
      if (el.dataset.jaAria === undefined) el.dataset.jaAria = el.getAttribute('aria-label') || '';
      el.setAttribute('aria-label', L(el.dataset.jaAria, el.dataset.zhAria));
    });
  }
  function setLang(lang) {
    LANG = lang; lsSet('futago-lang', lang);
    setLabels(); applyLang(); render(); renderRing();
    if (S.form && S.form.type === 'settings') renderSettings(); else renderForm();
  }
  const langSwitchHTML = () => `<div class="seg" role="group" aria-label="言語 / 語言">${[['ja', '日本語'], ['zh', '繁體中文']].map(([k, label]) =>
    `<button type="button" data-lang="${k}" aria-pressed="${LANG === k}">${label}</button>`).join('')}</div>`;

  function dayLabel(ms) {
    const d = new Date(ms), today = startOfDay(Date.now()), k = startOfDay(ms);
    const base = L(`${d.getMonth() + 1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`, `${d.getMonth() + 1}月${d.getDate()}日（週${'日一二三四五六'[d.getDay()]}）`);
    if (k === today) return `${L('今日', '今天')} ${base}`;
    if (k === today - DAY) return `${L('きのう', '昨天')} ${base}`;
    return base;
  }
  function durParts(ms) {
    const m = Math.max(0, Math.floor(ms / MIN));
    return { h: Math.floor(m / 60), m: m % 60 };
  }
  function durText(ms) {
    const { h, m } = durParts(ms);
    return h ? L(`${h}時間${m}分`, `${h}小時${m}分`) : L(`${m}分`, `${m}分鐘`);
  }

  // ---------- time picker: ±1 hour and :00 / :15 / :30 / :45, no scrolling ----------
  // Feed times are kept in 15-minute steps. A recorded feed may sit at most FUTURE_OK ahead of now,
  // so "今" can round 9:08 up to 9:15.
  const QUARTER = 15 * MIN, FUTURE_OK = 10 * MIN;
  const roundQ = t => Math.round(t / QUARTER) * QUARTER;
  const nowQ = () => roundQ(Date.now());
  function tpDay(at) {
    const k = startOfDay(at), today = startOfDay(Date.now()), d = new Date(at);
    if (k === today) return L('今日', '今天');
    if (k === today - DAY) return L('きのう', '昨天');
    if (k === today + DAY) return L('明日', '明天');
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }
  const tpLabel = at => `<small>${tpDay(at)}</small><b>${fmtT(at)}</b>`;
  function tpApply(at, op) {
    if (op === 'now') return nowQ();
    if (op === 'h-1') return at - HOUR;
    if (op === 'h+1') return at + HOUR;
    const d = new Date(at); d.setMinutes(Number(op.slice(1)), 0, 0); return d.getTime();
  }
  // scope tells the click handler what the picker edits: "f" (record form), "b:<row>" (backfill), "s:<twin>" (timetable).
  // past=true greys out choices that would land in the future.
  function tpHTML(scope, at, past) {
    const lim = Date.now() + FUTURE_OK, dis = t => past && t > lim ? 'disabled' : '';
    const mins = new Date(at).getMinutes();
    return `<div class="tp">
      <div class="tp-row">
        <button type="button" class="tp-step" data-tp="${scope}:h-1">−1${L('時間', '小時')}</button>
        <div class="tp-val num">${tpLabel(at)}</div>
        <button type="button" class="tp-step" data-tp="${scope}:h+1" ${dis(at + HOUR)}>+1${L('時間', '小時')}</button>
      </div>
      <div class="tp-mins" role="group" aria-label="${L('分', '分')}">${[0, 15, 30, 45].map(m =>
        `<button type="button" data-tp="${scope}:m${m}" aria-pressed="${mins === m}" ${dis(tpApply(at, 'm' + m))}>:${p2(m)}</button>`).join('')}
        ${past ? `<button type="button" class="tp-now" data-tp="${scope}:now">${L('今', '現在')}</button>` : ''}</div>
    </div>`;
  }

  // ---------- state ----------
  const S = {
    mode: 'loading', db: null,
    babies: {}, logs: [],
    dbRecent: [], dbWeights: [],
    local: lsGet(LS_DATA, { babies: {}, logs: {} }),
    filter: 'all', daysShown: 3, wShown: 8, planStart: {}, simOpen: null,
    trendMode: lsGet('futago-trend', 'day') === 'month' ? 'month' : 'day', history: null, historyLoading: false,
    // Trend view: one twin at a time (stacked per-feed bars) or both side by side; trendDay = the day whose feeds are listed.
    trendBaby: ['ane', 'imouto', 'both'].includes(lsGet('futago-trend-baby', 'ane')) ? lsGet('futago-trend-baby', 'ane') : 'ane', trendDay: null,
    // Growth chart x-axis: actual age by default so the birth weight sits at the start of the curve;
    // corrected age is one tap away for preterm babies. (Milestones always use corrected age.)
    corrected: lsGet('futago-corrected2', false) === true,
    gMetric: ['weight', 'height', 'head'].includes(lsGet('futago-gmetric', 'weight')) ? lsGet('futago-gmetric', 'weight') : 'weight', tab: ['now', 'plan', 'log', 'weight'].includes(lsGet('futago-tab', 'now')) ? lsGet('futago-tab', 'now') : 'now',
    alarm: { pref: lsGet('futago-alarm-pref', false), active: false, lead: lsGet('futago-alarm-lead', 10), ack: lsGet('futago-alarm-ack', {}), snooze: {} },
    ringing: [],
    form: null,
  };
  // The default names 姉/妹 are shown as 姊姊/妹妹 in Chinese; a name the family typed is shown as typed.
  const ZH_DEFAULT_NAME = { ane: '姊姊', imouto: '妹妹' };
  const baby = id => {
    const b = { ...DEFAULTS[id], ...(S.babies[id] || {}) };
    if (LANG === 'zh' && b.name === DEFAULTS[id].name) b.name = ZH_DEFAULT_NAME[id];
    return b;
  };

  function setLogs(list) {
    S.logs = list.filter(l => l && BABY_IDS.includes(l.baby) && TYPE_LABEL[l.type] && typeof l.at === 'number').sort((a, b) => b.at - a.at);
  }
  function fromLocal() {
    S.babies = S.local.babies || {};
    setLogs(Object.entries(S.local.logs || {}).map(([id, v]) => ({ ...v, id })));
  }
  function mergeDb() {
    const m = new Map();
    for (const l of S.dbWeights) m.set(l.id, l);
    for (const l of S.dbRecent) m.set(l.id, l);
    setLogs([...m.values()]);
  }

  // ---------- storage ----------
  // Records live in Firebase Firestore. Who may read/write is enforced by firestore.rules
  // (only the two family Google accounts); the page itself just signs in with Google.
  // Without a Firebase config the page falls back to this browser's localStorage.
  let unsubs = [];
  function stopSubs() { unsubs.forEach(u => { try { u(); } catch {} }); unsubs = []; S.dbRecent = []; S.dbWeights = []; }
  async function init() {
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg || !cfg.apiKey || !window.firebase) { S.mode = 'local'; fromLocal(); render(); return; }
    firebase.initializeApp(cfg);
    const fs = firebase.firestore();
    try { await fs.enablePersistence({ synchronizeTabs: true }); } catch {}
    S.db = fs; S.auth = firebase.auth();
    S.auth.onAuthStateChanged(u => {
      S.user = u; stopSubs(); S.logs = []; S.babies = {};
      if (!u) { S.mode = 'signin'; render(); return; }
      S.mode = 'db'; subscribe(); render();
    });
  }
  function subscribe() {
    const fs = S.db;
    const onErr = e => {
      if (e && e.code === 'permission-denied') { S.mode = 'denied'; stopSubs(); render(); }
      else toast(L('記録を読み込めませんでした。通信状況を確認してください。', '無法載入紀錄，請確認網路連線。'));
    };
    unsubs.push(fs.collection('babies').onSnapshot(s => {
      const b = {}; s.docs.forEach(d => { b[d.id] = d.data(); }); S.babies = b; render();
    }, onErr));
    unsubs.push(fs.collection('logs').orderBy('at', 'desc').limit(1000).onSnapshot(s => {
      S.dbRecent = s.docs.map(d => ({ ...d.data(), id: d.id })); mergeDb(); render();
    }, onErr));
    unsubs.push(fs.collection('logs').where('type', '==', 'weight').onSnapshot(s => {
      S.dbWeights = s.docs.map(d => ({ ...d.data(), id: d.id })); mergeDb(); render();
    }, onErr));
  }
  function signIn() {
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    S.auth.signInWithPopup(p).catch(e => {
      if (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')) return;
      if (e && e.code === 'auth/popup-blocked') return toast(L('ポップアップがブロックされました。ブラウザの設定でこのサイトのポップアップを許可してください。', '彈出視窗被封鎖了，請在瀏覽器設定中允許此網站的彈出視窗。'));
      if (e && e.code === 'auth/unauthorized-domain') return toast(L('このURLはまだ Firebase に登録されていません。手順書の「承認済みドメイン」を設定してください。', '此網址尚未在 Firebase 登記，請設定「已授權網域」。'));
      toast(L('ログインできませんでした（', '無法登入（') + (e && e.code || L('不明なエラー', '未知錯誤')) + L('）', '）'));
    });
  }
  function signOut() { S.auth && S.auth.signOut(); }

  function errMsg(e) {
    const c = e && e.code;
    if (c === 'permission-denied') return L('保存できませんでした。許可された Google アカウントでログインしているか確認してください。', '無法儲存。請確認是否使用已授權的 Google 帳號登入。');
    if (c === 'resource-exhausted') return L('保存の上限に達しました。しばらくしてからもう一度お試しください。', '已達儲存上限，請稍後再試。');
    return L('保存できませんでした。もう一度お試しください。', '無法儲存，請再試一次。');
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  // Firestore applies writes locally right away and syncs in the background (also when offline),
  // so the UI does not wait for the server; a later rejection shows up as a toast.
  const bg = p => { p.catch(e => toast(errMsg(e))); };

  // Returns the record's id (a fresh one for new records) so a save can be undone.
  async function saveLog(id, data) {
    if (S.mode === 'db') {
      const col = S.db.collection('logs'), ref = id ? col.doc(id) : col.doc();
      bg(ref.set(data));
      return ref.id;
    } else {
      const key = id || newId();
      S.local.logs[key] = data; lsSet(LS_DATA, S.local); fromLocal(); render();
      return key;
    }
  }
  async function deleteLog(id) {
    if (S.mode === 'db') bg(S.db.collection('logs').doc(id).delete());
    else { delete S.local.logs[id]; lsSet(LS_DATA, S.local); fromLocal(); render(); }
  }
  // Merges into the twin's settings doc, so saving names never wipes birth data or milestones.
  // A milestone value of null removes that milestone.
  async function saveBaby(id, data) {
    if (S.mode === 'db') {
      const body = { ...data };
      if (body.ms) body.ms = Object.fromEntries(Object.entries(body.ms).map(([k, v]) => [k, v === null ? firebase.firestore.FieldValue.delete() : v]));
      bg(S.db.doc('babies/' + id).set(body, { merge: true }));
    } else {
      const cur = S.local.babies[id] || {}, next = { ...cur, ...data };
      if (data.ms) { next.ms = { ...(cur.ms || {}) }; for (const [k, v] of Object.entries(data.ms)) { if (v === null) delete next.ms[k]; else next.ms[k] = v; } }
      S.local.babies[id] = next; lsSet(LS_DATA, S.local); fromLocal(); render();
    }
  }

  function renderGate() {
    const root = $('#gate-root');
    if (S.mode === 'signin') {
      root.innerHTML = `<div class="gate"><div class="gate-box">
        <div class="twin" aria-hidden="true"><i></i><i></i></div>
        <h1>${L('ふたごミルク帳', '雙胞胎餵奶紀錄')}</h1>
        <p>${L('家族専用の記録帳です。登録した Google アカウントでログインしてください。', '這是家人專用的紀錄。請使用已登記的 Google 帳號登入。')}</p>
        <button type="button" class="btn solid" data-act="signin">${L('Google でログイン', '使用 Google 登入')}</button>
        <div>${langSwitchHTML()}</div>
        <a class="linklike" href="help.html">${L('使い方を見る', '查看使用說明')}</a>
      </div></div>`;
    } else if (S.mode === 'denied') {
      root.innerHTML = `<div class="gate"><div class="gate-box">
        <h1>${L('このアカウントでは見られません', '此帳號無法查看')}</h1>
        <p>${L(`${esc(S.user && S.user.email)} は、この記録帳を見られるアカウントに登録されていません。`, `${esc(S.user && S.user.email)} 尚未登記為可查看此紀錄的帳號。`)}</p>
        <button type="button" class="btn" data-act="signout">${L('別のアカウントでログイン', '使用其他帳號登入')}</button>
        <div>${langSwitchHTML()}</div>
      </div></div>`;
    } else root.innerHTML = '';
  }

  // ---------- derived ----------
  const lastOf = (id, type) => S.logs.find(l => l.baby === id && l.type === type);
  const weightsOf = id => S.logs.filter(l => l.baby === id && l.type === 'weight');
  const measuresOf = id => S.logs.filter(l => l.baby === id && l.type === 'measure');
  // Fever guide used for colouring: 37.5 and up is "warm", 38.0 and up is a fever.
  const tempLevel = t => t >= 38 ? 'hot' : t >= 37.5 ? 'warm' : '';
  // Recorded weights plus the birth weight (from 出生時の記録) as the oldest entry, newest first.
  const weightsWithBirth = id => {
    const b = baby(id), ws = weightsOf(id);
    return b.birthAt && b.birthWeight ? [...ws, { id: 'birth', birth: true, at: b.birthAt, grams: Number(b.birthWeight) }] : ws;
  };
  function nextAt(id) { const m = lastOf(id, 'milk'); return m ? m.at + baby(id).intervalH * HOUR : null; }
  function milkText(l) {
    if (l.kind === 'breast') return `${KIND.breast} ${l.min || '?'}${L('分', '分鐘')}`;
    return `${KIND[l.kind] || KIND.formula} ${l.ml ?? '?'}mL`;
  }
  // Amounts are picked from a 10 mL scroll list that opens at the twin's previous bottle amount.
  const ML_MIN = 10, ML_MAX = 300, ML_STEP = 10;
  function lastMl(id) {
    const l = S.logs.find(x => x.baby === id && x.type === 'milk' && x.kind !== 'breast' && x.ml);
    const v = l ? Number(l.ml) : baby(id).maxMl;
    return Math.min(ML_MAX, Math.max(ML_MIN, Math.round(v / ML_STEP) * ML_STEP));
  }
  function mlOptions(selected, compact) {
    const vals = new Set();
    for (let m = ML_MIN; m <= ML_MAX; m += ML_STEP) vals.add(m);
    if (selected) vals.add(Number(selected));   // keep an older odd amount like 45 selectable when editing
    return [...vals].sort((a, b) => a - b).map(m => `<option value="${m}" ${Number(selected) === m ? 'selected' : ''}>${m}${compact ? '' : ' mL'}</option>`).join('');
  }
  function dayStats(id, from, to) {
    const st = { milkN: 0, ml: 0, breastN: 0, pee: 0, poo: 0 };
    for (const l of S.logs) {
      if (l.baby !== id || l.at < from || l.at >= to) continue;
      if (l.type === 'milk') { st.milkN++; if (l.kind === 'breast') st.breastN++; else st.ml += Number(l.ml) || 0; }
      else if (l.type === 'pee') st.pee++;
      else if (l.type === 'poo') st.poo++;
    }
    return st;
  }
  function describe(l) {
    if (l.type === 'milk') return esc(milkText(l));
    if (l.type === 'pee') return TYPE_LABEL.pee;
    if (l.type === 'poo') {
      const parts = [];
      if (l.color) parts.push(l.color === 'pale' ? `<span class="pale-flag">${POO_COLOR.pale}</span>` : POO_COLOR[l.color]);
      if (l.amount) parts.push(POO_AMT[l.amount]);
      return TYPE_LABEL.poo + (parts.length ? ' · ' + parts.join(' · ') : '');
    }
    if (l.type === 'weight') return `${fmtG(l.grams)}g`;
    if (l.type === 'measure') return [l.height ? `${L('身長', '身長')} ${Number(l.height).toFixed(1)}cm` : '', l.head ? `${L('頭囲', '頭圍')} ${Number(l.head).toFixed(1)}cm` : ''].filter(Boolean).join(' · ');
    if (l.type === 'temp') {
      const syms = (l.sym || []).map(k => SYMPTOMS[k]).filter(Boolean);
      return [l.temp ? `<span class="temp ${tempLevel(l.temp)}">${Number(l.temp).toFixed(1)}℃</span>` : '', syms.join('・')].filter(Boolean).join(' · ') || TYPE_LABEL.temp;
    }
    return '';
  }

  // ---------- render ----------
  function render() {
    renderGate(); renderNames(); renderCards(); renderPlanSim(); renderPlan(); renderTimeline(); renderTrend(); renderBirthInfo(); renderChart(); renderWeights(); renderDev(); renderAlarmBar(); renderModeNote(); tick();
  }
  function renderNames() {
    document.querySelectorAll('#filter [data-name]').forEach(b => { b.textContent = baby(b.dataset.name).name; });
  }
  function renderModeNote() {
    const el = $('#mode-note'), acc = $('#account');
    if (S.mode === 'db') el.textContent = L('記録はクラウドに保存され、登録したふたりのアカウントで共有されます。', '紀錄儲存在雲端，由兩個登記的帳號共享。');
    else if (S.mode === 'local') el.textContent = L('Firebase が未設定のため、記録はこの端末のブラウザだけに保存されています。', 'Firebase 尚未設定，紀錄只儲存在此裝置的瀏覽器中。');
    else el.textContent = L('読み込み中…', '載入中…');
    acc.hidden = S.mode !== 'db' || !S.user;
    if (!acc.hidden) acc.innerHTML = `${L(`${esc(S.user.email)} でログイン中`, `已用 ${esc(S.user.email)} 登入`)} <button type="button" class="linklike" data-act="signout">${L('ログアウト', '登出')}</button>`;
  }

  function renderCards() {
    const now = Date.now(), t0 = startOfDay(now);
    $('#babies').innerHTML = BABY_IDS.map(id => {
      const b = baby(id), ws = weightsWithBirth(id), w = ws[0], prev = ws[1];
      const st = dayStats(id, t0, t0 + DAY);
      const lastPoo = lastOf(id, 'poo'), lastMilk = lastOf(id, 'milk');
      const range = b.minMl === b.maxMl ? `${b.minMl}mL` : `${b.minMl}〜${b.maxMl}mL`;
      let wHTML = `<b>—</b><small>${L('体重未記録', '尚未記錄體重')}</small>`;
      if (w) {
        const diff = prev ? w.grams - prev.grams : null;
        const d = new Date(w.at);
        wHTML = `<b class="num">${fmtG(w.grams)}g</b><small>${d.getMonth() + 1}/${d.getDate()}${diff !== null ? ` · ${L('前回比', '比上次')} ${diff >= 0 ? '+' : ''}${fmtG(diff)}g` : ''}</small>`;
      }
      const leadTxt = S.alarm.lead ? L(`${S.alarm.lead}分前`, `前${S.alarm.lead}分鐘`) : L('時刻', '時間');
      // Card reads top to bottom: when is the next feed → what was the last one → record → today's totals.
      return `<article class="card" data-baby="${id}">
        <div class="card-head">
          <div class="who-wrap">${avatarHTML(id, 'lg', true)}
          <div class="who-age"><h2>${esc(b.name)}</h2>${b.birthAt
            ? `<small class="age">${ageText(id, true)}</small>`
            : `<button type="button" class="age-add" data-act="birth">${L('＋ 出生日を登録', '＋ 登錄出生日')}</button>`}</div></div>
          <div class="weight">${wHTML}</div>
        </div>
        <div class="next">
          <div class="next-top">
            <span class="label">${L('次の授乳', '下次餵奶')}</span>
            <button type="button" class="rule" data-bset="${id}" aria-label="${L(`${esc(b.name)}の授乳間隔と量を変更`, `更改${esc(b.name)}的餵奶間隔與量`)}">${L(`${b.intervalH}時間ごと`, `每${b.intervalH}小時`)}・${range}<span>${L('変更', '更改')}</span></button>
          </div>
          <div class="cd" data-cd="${id}"></div>
          <div class="bar" data-bar="${id}"><i></i></div>
          <div class="last-row">
            <div class="cd-sub num" data-cdsub="${id}"></div>
            ${lastMilk ? `<button type="button" class="fix-last" data-edit="${esc(lastMilk.id)}" aria-label="${L(`前回の授乳（${fmtT(lastMilk.at)}）を修正・削除`, `修改或刪除上次餵奶（${fmtT(lastMilk.at)}）`)}">${L('修正', '修改')}</button>` : ''}
          </div>
        </div>
        <div class="actions${IS_IOS ? ' has-timer' : ''}">
          <button type="button" class="milk" data-add="milk" data-baby="${id}">${L('授乳を記録', '記錄餵奶')}</button>
          ${IS_IOS ? `<button type="button" class="timer" data-iostimer="${id}" aria-label="${L(`iPhone のタイマーを次のミルクの${leadTxt}にセット`, `把 iPhone 計時器設在下次餵奶${leadTxt}`)}">iPhone<br>${L('タイマー', '計時器')}${S.alarm.lead ? `<small>${L(`${S.alarm.lead}分前`, `前${S.alarm.lead}分`)}</small>` : ''}</button>` : ''}
          <div class="subs">
            <button type="button" class="sub" data-add="pee" data-baby="${id}">${TYPE_LABEL.pee}</button>
            <button type="button" class="sub" data-add="poo" data-baby="${id}">${TYPE_LABEL.poo}</button>
            <button type="button" class="sub" data-add="temp" data-baby="${id}">${L('体温', '體溫')}</button>
            <button type="button" class="sub" data-add="weight" data-baby="${id}">${TYPE_LABEL.weight}</button>
          </div>
        </div>
        <div class="today num"><span class="lbl">${L('今日', '今天')}</span>${TYPE_LABEL.milk} <b>${st.milkN}</b>${L('回', '次')}${st.ml ? ` ${st.ml}mL` : ''}${st.breastN ? L(`（母乳${st.breastN}回）`, `（親餵${st.breastN}次）`) : ''} ・ ${TYPE_LABEL.pee} <b>${st.pee}</b> ・ ${TYPE_LABEL.poo} <b>${st.poo}</b>${lastPoo ? L(`（最後 ${durText(now - lastPoo.at)}前）`, `（最後一次 ${durText(now - lastPoo.at)}前）`) : ''}</div>
      </article>`;
    }).join('');
  }

  // Timetable: past 12h of actual feeds plus the next 24h projected from each twin's last feed,
  // merged into one time-ordered list with a column per twin.
  const PLAN_PAST = 12 * HOUR, PLAN_AHEAD = 24 * HOUR, CLOSE_GAP = 30 * MIN;
  function renderPlan() {
    const el = $('#plan');
    if (S.mode === 'loading') { el.innerHTML = `<p class="empty-note">${L('記録を読み込んでいます…', '正在載入紀錄…')}</p>`; return; }
    const now = Date.now(), items = [], missing = [];
    for (const id of BABY_IDS) {
      const b = baby(id), last = lastOf(id, 'milk'), start = S.planStart[id];
      // Actual feeds; with a "what if" start time, only the ones before it still count.
      S.logs.forEach(l => { if (l.baby === id && l.type === 'milk' && l.at >= now - PLAN_PAST && (!start || l.at < start)) items.push({ at: l.at, baby: id, kind: 'done', log: l }); });
      if (!start && !last) { missing.push(id); continue; }
      const step = b.intervalH * HOUR;
      if (start) {
        items.push({ at: start, baby: id, kind: 'start' });
        let nextMarked = false;
        for (let t = start + step; t <= Math.max(now, start) + PLAN_AHEAD; t += step) {
          const isNext = !nextMarked && t >= now; if (isNext) nextMarked = true;
          items.push({ at: t, baby: id, kind: isNext ? 'next' : 'plan' });
        }
      } else {
        for (let t = last.at + step, k = 0; t <= now + PLAN_AHEAD; t += step, k++) items.push({ at: t, baby: id, kind: k === 0 ? 'next' : 'plan' });
      }
    }
    if (!items.length) {
      el.innerHTML = `<p class="empty-note">${L('「いま」タブで授乳を記録すると、ここに次からの予定がふたり並んで表示されます。', '在「現在」分頁記錄餵奶後，這裡會並排顯示兩人接下來的預定時間。')}</p>`;
      return;
    }
    items.sort((a, b) => a.at - b.at);
    // Upcoming feeds of the two twins less than 30 minutes apart get a "続けて" flag.
    const upcoming = items.filter(i => i.kind !== 'done');
    upcoming.forEach(i => { i.close = upcoming.some(j => j.baby !== i.baby && Math.abs(j.at - i.at) < CLOSE_GAP); });
    // One row per minute; both twins share a row when their times match.
    const rows = [];
    for (const i of items) {
      const key = Math.floor(i.at / MIN), r = rows[rows.length - 1];
      if (r && r.key === key && !r[i.baby]) r[i.baby] = i;
      else rows.push({ key, at: i.at, [i.baby]: i });
    }
    const cell = (id, i) => {
      if (!i) return `<div class="pc ${id}"></div>`;
      const b = baby(id), range = b.minMl === b.maxMl ? `${b.minMl}mL` : `${b.minMl}〜${b.maxMl}mL`;
      if (i.kind === 'done') return `<div class="pc ${id} done">${L('済', '已餵')} ${esc(milkText(i.log))}</div>`;
      if (i.kind === 'start') return `<div class="pc ${id} start"><b>${L('ここで飲む', '此時餵奶')}</b> ${range}</div>`;
      if (i.kind === 'next') {
        const due = now >= i.at;
        return `<div class="pc ${id} next${due ? ' due' : ''}"><b>${L('次', '下次')}</b> ${range}<small>${due ? L(`${durText(now - i.at)} すぎ`, `已超過 ${durText(now - i.at)}`) : L(`あと ${durText(i.at - now)}`, `還有 ${durText(i.at - now)}`)}</small></div>`;
      }
      return `<div class="pc ${id} plan">${range}</div>`;
    };
    let html = `<div class="plan-head"><div></div>${BABY_IDS.map(id => `<div class="${id}">${avatarHTML(id, 'sm')}${esc(baby(id).name)}<small>${L(`${baby(id).intervalH}時間ごと`, `每${baby(id).intervalH}小時`)}</small></div>`).join('')}</div>`;
    let lastDay = null, nowShown = false;
    for (const r of rows) {
      const day = startOfDay(r.at);
      if (day !== lastDay) { html += `<div class="plan-day">${dayLabel(r.at)}</div>`; lastDay = day; }
      if (!nowShown && r.at > now) { html += `<div class="plan-now num">${L('いま', '現在')} ${fmtT(now)}</div>`; nowShown = true; }
      const close = BABY_IDS.some(id => r[id] && r[id].close);
      html += `<div class="plan-row${r.at <= now ? ' row-past' : ''}"><div class="pt num">${fmtT(r.at)}${close ? `<small>${L('ふたり続けて', '兩人接連')}</small>` : ''}</div>${BABY_IDS.map(id => cell(id, r[id])).join('')}</div>`;
    }
    if (missing.length) html += `<p class="hint">${L(`${missing.map(id => esc(baby(id).name)).join('と')}はまだ授乳の記録がないため、予定を出せません。`, `${missing.map(id => esc(baby(id).name)).join('和')}還沒有餵奶紀錄，無法顯示預定時間。`)}</p>`;
    el.innerHTML = html;
  }

  // "What if" times above the timetable: each twin's time is a button that opens the ±1h / quarter-hour
  // picker. Nothing here is saved.
  let simKey = '';
  function renderPlanSim(force) {
    const key = [LANG, S.simOpen || '', ...BABY_IDS.map(id => baby(id).name + '|' + (S.planStart[id] || ''))].join('/');
    if (!force && key === simKey) return;   // leave it alone on data refreshes
    simKey = key;
    const on = BABY_IDS.some(id => S.planStart[id]), el = $('#plan-sim'), open = S.simOpen;
    el.className = 'plan-sim' + (on ? ' on' : '');
    el.innerHTML = `<div class="sim-head"><b>${L('飲む時刻を指定して計算', '指定餵奶時間來計算')}</b>
        ${on ? `<button type="button" class="fix-last" data-act="sim-reset">${L('記録どおりに戻す', '回到實際紀錄')}</button>` : ''}</div>
      <div class="sim-row">${BABY_IDS.map(id => `<div class="sim-field ${id}"><span>${esc(baby(id).name)}</span>
        <button type="button" class="tbtn" data-sopen="${id}" aria-expanded="${open === id}">${S.planStart[id] ? tpLabel(S.planStart[id]) : `<small>${L('タップして時刻を選ぶ', '點選設定時間')}</small>`}</button></div>`).join('')}</div>
      ${open ? `<div class="sim-tp">${tpHTML('s:' + open, S.planStart[open], false)}
        <div class="row"><button type="button" class="btn ghost" data-act="sim-clear">${L(`${esc(baby(open).name)}の指定を消す`, `清除${esc(baby(open).name)}的設定`)}</button><span class="spacer" style="flex:1"></span><button type="button" class="btn solid" data-act="sim-done">${L('OK', '完成')}</button></div></div>` : ''}
      <p class="hint">${on
        ? L('指定した時刻に飲んだ場合の予定です。記録はされません。', '這是在指定時間餵奶時的預定，不會存成紀錄。')
        : L('時刻を選ぶと、その時刻に飲んだ場合の次からの時間を一覧できます（記録はされません）。', '選擇時間後，可以看到在那個時間餵奶時之後的時間表（不會存成紀錄）。')}</p>`;
  }

  function renderTimeline() {
    const el = $('#timeline');
    if (S.mode === 'loading') { el.innerHTML = `<p class="empty-note">${L('記録を読み込んでいます…', '正在載入紀錄…')}</p>`; return; }
    const list = S.logs.filter(l => S.filter === 'all' || l.baby === S.filter);
    if (!list.length) {
      el.innerHTML = `<p class="empty-note">${L('まだ記録がありません。「いま」タブのカードから「授乳を記録」すると、ここに並びます。', '還沒有紀錄。在「現在」分頁點「記錄餵奶」後，就會顯示在這裡。')}</p>`;
      return;
    }
    const groups = new Map();
    for (const l of list) { const k = startOfDay(l.at); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(l); }
    const keys = [...groups.keys()];
    const shown = keys.slice(0, S.daysShown);
    const ids = S.filter === 'all' ? BABY_IDS : [S.filter];
    el.innerHTML = shown.map(k => {
      const sums = ids.map(id => {
        const st = dayStats(id, k, k + DAY);
        return `<span><em class="${id}">${esc(baby(id).name)}</em> ${L(`授乳${st.milkN}回`, `餵奶${st.milkN}次`)} ${st.ml}mL · ${L('尿', '尿')}${st.pee} · ${L('便', '便')}${st.poo}</span>`;
      }).join('　');
      return `<div class="day"><div class="day-head"><h3>${dayLabel(k)}</h3><div class="sum num">${sums}</div></div>
        <ul class="items">${groups.get(k).map(l => `<li><button type="button" class="item" data-edit="${esc(l.id)}" aria-label="${L(`${esc(baby(l.baby).name)} ${TYPE_LABEL[l.type]} ${fmtT(l.at)} を修正`, `修改 ${esc(baby(l.baby).name)} ${fmtT(l.at)} 的${TYPE_LABEL[l.type]}`)}">
          <span class="t num">${fmtT(l.at)}</span>
          <span class="chip ${l.baby}">${esc(baby(l.baby).name)}</span>
          <span class="k">${TYPE_LABEL[l.type]}</span>
          <span class="d">${describe(l)}${l.note ? `<small>${esc(l.note)}</small>` : ''}</span>
          <span class="fix" aria-hidden="true">${L('修正', '修改')}</span>
        </button></li>`).join('')}</ul></div>`;
    }).join('') + (keys.length > S.daysShown ? `<div class="more"><button type="button" class="btn ghost" data-act="more">${L(`さらに前の日を表示（残り${keys.length - S.daysShown}日）`, `顯示更早的日子（還有${keys.length - S.daysShown}天）`)}</button></div>` : '');
  }

  // ---------- trends: milk mL, pee and poo counts per day (last 14 days) or per month (last 6 months) ----------
  // The live subscription holds roughly the last few weeks, so the monthly view reads the last 6 months
  // from the database once per page load.
  const TREND_DAYS = 14, TREND_MONTHS = 6;
  const monthStart = (ms, back = 0) => { const d = new Date(ms); return new Date(d.getFullYear(), d.getMonth() - back, 1).getTime(); };
  async function loadHistory() {
    if (S.history || S.historyLoading || S.mode !== 'db') return;
    S.historyLoading = true;
    try {
      const snap = await S.db.collection('logs').where('at', '>=', monthStart(Date.now(), TREND_MONTHS - 1)).get();
      S.history = snap.docs.map(d => ({ ...d.data(), id: d.id }));
    } catch { toast(L('過去の記録を読み込めませんでした。', '無法載入過去的紀錄。')); }
    S.historyLoading = false;
    renderTrend();
  }
  function bucketTotals(logs, keyOf) {
    const out = new Map();
    for (const l of logs) {
      if (!BABY_IDS.includes(l.baby)) continue;
      const k = keyOf(l.at);
      if (!out.has(k)) out.set(k, Object.fromEntries(BABY_IDS.map(id => [id, { ml: 0, pee: 0, poo: 0 }])));
      const t = out.get(k)[l.baby];
      if (l.type === 'milk' && l.kind !== 'breast') t.ml += Number(l.ml) || 0;
      else if (l.type === 'pee') t.pee++;
      else if (l.type === 'poo') t.poo++;
    }
    return out;
  }
  const niceStep = max => [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000].find(s => max / s <= 4) || 10000;
  function yGrid(W, pl, pr, top, step, y) {
    let svg = '';
    for (let v = 0; v <= top; v += step) {
      svg += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v ? 0.6 : 1}"/>`;
      svg += `<text x="${pl - 4}" y="${y(v) + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${v >= 10000 ? `${v / 1000}k` : fmtG(v)}</text>`;
    }
    return svg;
  }
  // Grouped bars, one colour per twin. The last period is still being counted, so it is drawn faded.
  function barChart(labels, series, unit, partialLast) {
    const W = 360, H = 170, pl = 34, pr = 6, pt = 14, pb = 22;
    const max = Math.max(1, ...series.flatMap(s => s.values)), step = niceStep(max), top = Math.ceil(max / step) * step;
    const n = labels.length, gw = (W - pl - pr) / n, bw = Math.min(14, (gw - 3) / series.length);
    const y = v => pt + (1 - v / top) * (H - pt - pb);
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img">` + yGrid(W, pl, pr, top, step, y);
    const every = Math.ceil(n / 7);
    labels.forEach((lab, i) => {
      const gx = pl + i * gw, x0 = gx + (gw - bw * series.length) / 2;
      series.forEach((s, k) => {
        const v = s.values[i], h = y(0) - y(v);
        svg += `<rect x="${(x0 + k * bw).toFixed(1)}" y="${y(v).toFixed(1)}" width="${(bw - 1).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="1.5" fill="${s.color}" opacity="${partialLast && i === n - 1 ? 0.4 : 1}"><title>${esc(s.name)} ${lab} ${fmtG(v)}${unit}</title></rect>`;
      });
      // count labels back from the newest period so the latest is always named and none collide
      if ((n - 1 - i) % every === 0) svg += `<text x="${(gx + gw / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="9" fill="var(--muted)">${lab}</text>`;
    });
    return svg + '</svg>';
  }
  // One twin's daily milk, each bar stacked from that day's feeds (earliest at the bottom) so the size of
  // every feed shows. Feeds alternate in shade; the amount is printed inside when the piece is tall enough.
  const feedsOn = (id, k) => S.logs.filter(l => l.baby === id && l.type === 'milk' && l.at >= k && l.at < k + DAY).sort((a, b) => a.at - b.at);
  function feedChart(id, keys, labels, sel) {
    const W = 360, H = 200, pl = 34, pr = 6, pt = 16, pb = 22;
    const feeds = keys.map(k => feedsOn(id, k).filter(l => l.kind !== 'breast' && Number(l.ml) > 0));
    const totals = feeds.map(f => f.reduce((s, l) => s + Number(l.ml), 0));
    const max = Math.max(1, ...totals), step = niceStep(max), top = Math.ceil(max / step) * step;
    const n = keys.length, gw = (W - pl - pr) / n, bw = Math.min(20, gw - 4);
    const y = v => pt + (1 - v / top) * (H - pt - pb);
    const color = `var(--${id === 'ane' ? 'ane' : 'imo'})`, every = Math.ceil(n / 7);
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img">` + yGrid(W, pl, pr, top, step, y);
    keys.forEach((k, i) => {
      const gx = pl + i * gw, x = gx + (gw - bw) / 2;
      svg += `<g data-tday="${k}">`;
      // The whole column is the tap target; the chosen day gets a soft band behind its bar.
      svg += `<rect x="${gx.toFixed(1)}" y="${pt - 12}" width="${gw.toFixed(1)}" height="${H - pb - pt + 12}" rx="4" fill="${k === sel ? 'var(--surface-2)' : 'transparent'}"${k === sel ? ' stroke="var(--line)"' : ''}/>`;
      let acc = 0;
      feeds[i].forEach((l, j) => {
        const v = Number(l.ml), y1 = y(acc + v), h = y(acc) - y1; acc += v;
        svg += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.5, h - 1.5).toFixed(1)}" rx="2" fill="${color}" opacity="${j % 2 ? 0.78 : 1}"><title>${fmtT(l.at)} ${v}mL</title></rect>`;
        if (h >= 10) svg += `<text x="${(x + bw / 2).toFixed(1)}" y="${(y1 + h / 2 + 2.5).toFixed(1)}" text-anchor="middle" font-size="7.5" font-weight="700" fill="var(--surface)" pointer-events="none">${v}</text>`;
      });
      if (totals[i]) svg += `<text x="${(gx + gw / 2).toFixed(1)}" y="${(y(totals[i]) - 3).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="var(--ink)" pointer-events="none">${totals[i]}</text>`;
      if ((n - 1 - i) % every === 0 || k === sel) svg += `<text x="${(gx + gw / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="9" fill="${k === sel ? 'var(--ink)' : 'var(--muted)'}" font-weight="${k === sel ? 700 : 400}" pointer-events="none">${labels[i]}</text>`;
      svg += '</g>';
    });
    return svg + '</svg>';
  }
  // The feeds of the chosen day, in order, under the chart.
  function feedDayHTML(id, k) {
    const all = feedsOn(id, k), ml = all.filter(l => l.kind !== 'breast' && Number(l.ml) > 0);
    const total = ml.reduce((s, l) => s + Number(l.ml), 0);
    const sum = all.length
      ? L(`合計 ${fmtG(total)}mL ・ ${all.length}回${ml.length ? ` ・ 1回平均 ${Math.round(total / ml.length)}mL` : ''}`, `合計 ${fmtG(total)}mL ・ ${all.length}次${ml.length ? ` ・ 每次平均 ${Math.round(total / ml.length)}mL` : ''}`)
      : L('授乳の記録なし', '沒有餵奶紀錄');
    return `<div class="tday"><div class="tday-head"><b>${dayLabel(k)}</b><span class="num">${sum}</span></div>
      ${all.length ? `<div class="tday-feeds num">${all.map(l => `<span class="${id}"><small>${fmtT(l.at)}</small><b>${l.kind === 'breast' ? L('母乳', '親餵') : `${Number(l.ml) || 0}`}</b>${l.kind === 'breast' ? (l.min ? `<small>${l.min}${L('分', '分')}</small>` : '') : '<small>mL</small>'}</span>`).join('')}</div>` : ''}</div>`;
  }
  function renderTrend() {
    const el = $('#trend'); if (!el) return;
    document.querySelectorAll('#trend-mode button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.trend === S.trendMode)));
    if (S.mode === 'loading') { el.innerHTML = `<p class="empty-note">${L('記録を読み込んでいます…', '正在載入紀錄…')}</p>`; return; }
    const now = Date.now(), today = startOfDay(now);
    const who = S.trendBaby, ids = who === 'both' ? BABY_IDS : [who];
    const tabs = `<div class="tbaby" role="group" aria-label="${L('表示する子', '顯示的寶寶')}">${[...BABY_IDS.map(id => [id, esc(baby(id).name)]), ['both', L('ふたり', '兩人')]].map(([k, lab]) =>
      `<button type="button" class="${k}" data-tbaby="${k}" aria-pressed="${who === k}">${lab}</button>`).join('')}</div>`;

    // At a glance: today so far vs the average of the last 7 full days.
    const byDay = bucketTotals(S.logs, startOfDay);
    const firstAt = S.logs.length ? S.logs[S.logs.length - 1].at : now;
    const avgDays = Math.max(1, Math.min(7, Math.round((today - startOfDay(firstAt)) / DAY)));
    const avgOf = (id, f) => { let s = 0; for (let i = 1; i <= avgDays; i++) { const b = byDay.get(today - i * DAY); if (b) s += b[id][f]; } return s / avgDays; };
    const tile = (id, f, unit) => {
      const t = (byDay.get(today) || {})[id], v = t ? t[f] : 0, a = avgOf(id, f);
      return `<div class="tile"><b class="num">${fmtG(v)}</b>${unit}<small class="num">${L('平均', '平均')} ${fmtG(Math.round(a))}${unit}</small></div>`;
    };
    let html = tabs + `<div class="tiles">
      <span class="th">${L('今日', '今天')}</span><span class="th">${TYPE_LABEL.milk}</span><span class="th">${TYPE_LABEL.pee}</span><span class="th">${TYPE_LABEL.poo}</span>

    let labels, keys, source, keyOf;
    if (S.trendMode === 'month') {

      // Older months come from the one-time read; recent days from the live data, so new records show up.
      const merged = new Map(); (S.history || []).forEach(l => merged.set(l.id, l)); S.logs.forEach(l => merged.set(l.id, l));
      source = [...merged.values()]; keyOf = ms => monthStart(ms);

      source = S.logs; keyOf = startOfDay;

    }
    const buckets = bucketTotals(source, keyOf);
    // Months before the first record are left off so the bars that exist get the room (keep at least 2).
    if (S.trendMode === 'month') {

      const series = ids.map(id => ({ name: baby(id).name, color: `var(--${id === 'ane' ? 'ane' : 'imo'})`, values: keys.map(k => (buckets.get(k) || {})[id] ? buckets.get(k)[id][f] : 0) }));

  const hasBirth = id => !!baby(id).birthAt;

  function monthAge(from, at = Date.now()) {
    const a = new Date(from), b = new Date(at);
    let m = (b.getFullYear() - a.getFullYear()) * 12 + b.getMonth() - a.getMonth();
    if (b.getDate() < a.getDate()) m--;

    return { m, d: dayAge(anchor.getTime(), at) };
  }
  function ymdText({ m, d }) {
    const y = Math.floor(m / 12), mo = m % 12;

    if (mo || (!y && m)) parts.push(L(`${mo}か月`, `${mo}個月`));
    parts.push(L(`${d}日`, `${d}天`));

  // ---------- icon photos ----------

  // Birth form: date and weeks of gestation are shared by the twins; time, weight and length are per twin.

  function renderBirth() {

  const toDateInput = ms => { const d = new Date(ms); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`; };

  // Weight / height / head circumference against the girls' percentile band (3–97 shaded, 10–90 darker,
  // 50 dashed), x = age in days. Which one is shown is S.gMetric.
  function growthMetric() {
    const m = S.gMetric;
    if (m === 'height') return {
      table: GIRL_HEIGHT, label: L('身長', '身長'), unit: 'cm', step: 5, pad: 1, fmt: v => `${v}`, val: v => `${v.toFixed(1)}cm`,
      pts: (id, base) => { const b = baby(id), p = measuresOf(id).filter(l => l.height).map(l => ({ x: (l.at - base) / DAY, g: Number(l.height) })); if (b.birthLength) p.push({ x: (b.birthAt - base) / DAY, g: Number(b.birthLength), birth: true }); return p; },
    };
    if (m === 'head') return {
      table: GIRL_HEAD, label: L('頭囲', '頭圍'), unit: 'cm', step: 2, pad: 0.5, fmt: v => `${v}`, val: v => `${v.toFixed(1)}cm`,
      pts: (id, base) => { const b = baby(id), p = measuresOf(id).filter(l => l.head).map(l => ({ x: (l.at - base) / DAY, g: Number(l.head) })); if (b.birthHead) p.push({ x: (b.birthAt - base) / DAY, g: Number(b.birthHead), birth: true }); return p; },
    };
    return {
      table: GIRL_WEIGHT, label: L('体重', '體重'), unit: 'kg', step: 500, pad: 100, fmt: v => `${(v / 1000).toFixed(1)}kg`, val: v => `${fmtG(v)}g`,
      pts: (id, base) => weightsWithBirth(id).map(l => ({ x: (l.at - base) / DAY, g: Number(l.grams), birth: !!l.birth })).filter(p => p.g > 0),
    };
  }
  function renderGrowthChart() {
    const M = growthMetric();
    const series = BABY_IDS.filter(hasBirth).map(id => ({ id, pts: M.pts(id, ageBase(baby(id), S.corrected)).sort((a, c) => a.x - c.x) }));
    $('#legend').innerHTML = BABY_IDS.map(id => `<span><i style="background:var(--${id === 'ane' ? 'ane' : 'imo'})"></i>${esc(baby(id).name)}</span>`).join('')
      + `<span><i style="background:var(--band);height:10px"></i>${L('全国の3〜97%の範囲', '全國3〜97%範圍')}</span>`;
    const all = series.flatMap(s => s.pts);
    const nowX = Math.max(...BABY_IDS.filter(hasBirth).map(id => (Date.now() - ageBase(baby(id), S.corrected)) / DAY));
    const x0 = Math.min(0, ...all.map(p => p.x)), x1 = Math.min(730, Math.max(90, nowX + 45, ...all.map(p => p.x + 15)));
    const W = 360, H = 260, pl = 40, pr = 26, pt = 10, pb = 26;
    const curve = M.table.filter(r => r[0] <= x1 + 200);
    const inRange = curve.filter(r => r[0] <= x1);
    const gMax = Math.max(...all.map(p => p.g), ...inRange.map(r => r[7])), gMin = Math.min(...all.map(p => p.g), ...inRange.map(r => r[1]));
    const step = M.unit === 'kg' ? (gMax - gMin > 4000 ? 1000 : 500) : M.step;
    const g0 = Math.floor((gMin - M.pad) / step) * step, g1 = Math.ceil((gMax + M.pad) / step) * step;
    const interp = (d, k) => interpTable(M.table, d, k);
    const x = d => pl + (d - x0) / (x1 - x0) * (W - pl - pr), y = g => pt + (1 - (g - g0) / (g1 - g0)) * (H - pt - pb);
    const clip = `<clipPath id="gc"><rect x="${pl}" y="${pt}" width="${W - pl - pr}" height="${H - pt - pb}"/></clipPath>`;
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L(`${M.label}と成長曲線`, `${M.label}與生長曲線`)}">${clip}`;
    for (let g = g0; g <= g1; g += step) {
      svg += `<line x1="${pl}" x2="${W - pr}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width=".6"/>`;
      svg += `<text x="${pl - 4}" y="${y(g) + 3}" text-anchor="end" font-size="9" fill="var(--muted)">${M.fmt(g)}</text>`;
    }
    const band = (lo, hi, fill) => `<path clip-path="url(#gc)" fill="${fill}" d="M${curve.map(r => `${x(r[0]).toFixed(1)},${y(r[lo]).toFixed(1)}`).join('L')}L${curve.slice().reverse().map(r => `${x(r[0]).toFixed(1)},${y(r[hi]).toFixed(1)}`).join('L')}Z"/>`;
    svg += band(1, 7, 'var(--band)') + band(2, 6, 'var(--band-2)');
    svg += `<polyline clip-path="url(#gc)" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" points="${curve.map(r => `${x(r[0]).toFixed(1)},${y(r[4]).toFixed(1)}`).join(' ')}"/>`;
    [[1, '3'], [4, '50'], [7, '97']].forEach(([k, lab]) => {
      const yy = y(interp(x1, k));
      if (yy > pt && yy < H - pb) svg += `<text x="${W - pr + 3}" y="${yy + 3}" font-size="8" fill="var(--muted)">${lab}</text>`;
    });
    // month ticks
    const mStep = x1 > 365 ? 3 : x1 > 180 ? 2 : 1;
    for (let mo = 0; mo * DAYS_PER_MONTH <= x1; mo += mStep) {
      const xx = x(mo * DAYS_PER_MONTH);
      svg += `<line x1="${xx}" x2="${xx}" y1="${H - pb}" y2="${H - pb + 3}" stroke="var(--muted)"/><text x="${xx}" y="${H - pb + 13}" text-anchor="middle" font-size="9" fill="var(--muted)">${mo}${L('か月', '月')}</text>`;
    }
    svg += `<line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="var(--muted)"/>`;
    if (nowX > x0 && nowX < x1) svg += `<line x1="${x(nowX)}" x2="${x(nowX)}" y1="${pt}" y2="${H - pb}" stroke="var(--danger)" stroke-width="1" stroke-dasharray="2 3"/><text x="${x(nowX) + 3}" y="${pt + 8}" font-size="8" fill="var(--danger)">${L('今日', '今天')}</text>`;
    for (const s of series) {
      if (!s.pts.length) continue;
      const col = `var(--${s.id === 'ane' ? 'ane' : 'imo'})`;
      if (s.pts.length > 1) svg += `<polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" points="${s.pts.map(p => `${x(p.x).toFixed(1)},${y(p.g).toFixed(1)}`).join(' ')}"/>`;
      s.pts.forEach((p, k) => {
        const lastPt = k === s.pts.length - 1;
        svg += `<circle cx="${x(p.x).toFixed(1)}" cy="${y(p.g).toFixed(1)}" r="${lastPt ? 4 : 2.6}" fill="${lastPt ? col : 'var(--surface)'}" stroke="${col}" stroke-width="1.6"><title>${esc(baby(s.id).name)} ${M.val(p.g)}${p.birth ? L('（出生時）', '（出生時）') : ''}</title></circle>`;
      });
    }
    svg += '</svg>';
    // Where the latest value sits within the national distribution.
    const where = series.map(s => {
      const lp = s.pts[s.pts.length - 1]; if (!lp) return '';
      const vals = PCT.map((_, k) => interp(Math.max(0, lp.x), k + 1));
      let band = L('3%未満', '低於3%');
      for (let k = 0; k < PCT.length; k++) if (lp.g >= vals[k]) band = k === PCT.length - 1 ? L('97%以上', '97%以上') : L(`${PCT[k]}〜${PCT[k + 1]}%`, `${PCT[k]}〜${PCT[k + 1]}%`);
      return `<span><b class="${s.id}">${esc(baby(s.id).name)}</b> ${M.val(lp.g)} ・ ${band}</span>`;
    }).filter(Boolean).join('');
    const empty = !all.length ? `<p class="empty-note">${L(`${M.label}の記録がまだありません。上のボタンから記録できます。`, `還沒有${M.label}的紀錄，可以從上方的按鈕記錄。`)}</p>` : '';
    $('#chart').innerHTML = svg + empty + `<p class="growth-where">${where}</p>
      <p class="trend-note">${L(`帯はこども家庭庁「令和5年乳幼児身体発育調査」女子の${M.label}（濃い帯10〜90%、点線50%）。${BABY_IDS.some(id => hasBirth(id) && isPreterm(baby(id))) && S.corrected ? '早産のため横軸は修正月齢（予定日=0）です。' : ''}発育は個人差が大きいので、気になるときは健診で相談してください。`,
        `色帶為日本兒童家庭廳「2023年嬰幼兒身體發育調查」女童${M.label}（深色10〜90%，虛線50%）。${BABY_IDS.some(id => hasBirth(id) && isPreterm(baby(id))) && S.corrected ? '因早產，橫軸為矯正月齡（預產期=0）。' : ''}發育個別差異大，若有疑慮請於健檢時諮詢。`)}</p>`;
  }
  // Linear interpolation of a percentile column (1..7) at an age in days.
  function interpTable(c, d, k) {
    if (d <= c[0][0]) return c[0][k];
    for (let i = 1; i < c.length; i++) if (d <= c[i][0]) { const [a, b] = [c[i - 1], c[i]]; return a[k] + (b[k] - a[k]) * (d - a[0]) / (b[0] - a[0]); }
    return c[c.length - 1][k];
  }

  // Development: each milestone's "most children" window on a 0–24 month track, with today's (corrected) age marked.

          // The birth row opens 出生時の記録 instead of the weight form.

        return `<button type="button" class="wrow num" data-edit="${esc(w.id)}" aria-label="${L(`${esc(baby(id).name)}の体重 ${d.getMonth() + 1}月${d.getDate()}日 ${fmtG(w.grams)}g を修正`, `修改${esc(baby(id).name)} ${d.getMonth() + 1}月${d.getDate()}日的體重 ${fmtG(w.grams)}g`)}">
          <span>${d.getMonth() + 1}/${d.getDate()} ${fmtT(w.at)}${w.note ? ` <small>${esc(w.note)}</small>` : ''}</span><b>${fmtG(w.grams)}g</b><span>${diff}</span><span>${perDay}</span></button>`;
      }).join('');
      return `<div class="wtable"><h3 class="${id}">${esc(baby(id).name)}</h3>
        <div class="wrow head" aria-hidden="true"><span>${L('日時', '日期時間')}</span><span>${L('体重', '體重')}</span><span>${L('前回比', '比上次')}</span><span>${L('1日あたり', '每天')}</span></div>${rows}
        ${ws.length > S.wShown ? `<button type="button" class="btn ghost more" data-act="wmore">${L(`さらに表示（残り${ws.length - S.wShown}件）`, `顯示更多（還有${ws.length - S.wShown}筆）`)}</button>` : ''}</div>`;
    }).join('');
  }

  function renderChart() {
    if (BABY_IDS.some(hasBirth)) return renderGrowthChart();   // with a birth date, weight is drawn against age and the growth curve
    const series = BABY_IDS.map(id => ({ id, pts: weightsOf(id).map(l => ({ t: l.at, g: Number(l.grams) })).filter(p => p.g > 0).sort((a, b) => a.t - b.t) }));
    $('#legend').innerHTML = BABY_IDS.map(id => `<span><i style="background:var(--${id === 'ane' ? 'ane' : 'imo'})"></i>${esc(baby(id).name)}</span>`).join('');
    const all = series.flatMap(s => s.pts);
    if (!all.length) { $('#chart').innerHTML = `<p class="empty-note">${L('体重を記録するとここにグラフが表示されます。', '記錄體重後，這裡會顯示圖表。')}</p>`; return; }
    const W = 640, H = 260, pl = 58, pr = 92, pt = 16, pb = 34;
    let t0 = Math.min(...all.map(p => p.t)), t1 = Math.max(...all.map(p => p.t));
    if (t1 - t0 < 3 * DAY) { const mid = (t0 + t1) / 2; t0 = mid - 1.5 * DAY; t1 = mid + 1.5 * DAY; }
    else { const pad = (t1 - t0) * 0.04; t0 -= pad; t1 += pad; }
    const gs = all.map(p => p.g);
    let g0 = Math.floor((Math.min(...gs) - 100) / 100) * 100, g1 = Math.ceil((Math.max(...gs) + 100) / 100) * 100;
    const span = g1 - g0, step = span <= 600 ? 100 : span <= 1200 ? 200 : span <= 3000 ? 500 : 1000;
    g0 = Math.floor(g0 / step) * step; g1 = Math.ceil(g1 / step) * step;
    const x = t => pl + (t - t0) / (t1 - t0) * (W - pl - pr);
    const y = g => pt + (1 - (g - g0) / (g1 - g0)) * (H - pt - pb);
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('体重の推移グラフ', '體重變化圖表')}">`;
    for (let g = g0; g <= g1; g += step) {
      svg += `<line x1="${pl}" x2="${W - pr}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/>`;
      svg += `<text x="${pl - 8}" y="${y(g) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" class="num">${fmtG(g)}g</text>`;
    }
    const days = Math.max(1, Math.round((t1 - t0) / DAY));
    const every = Math.max(1, Math.ceil(days / 6));
    let d = startOfDay(t0) + DAY, i = 0;
    for (; d <= t1; d += DAY, i++) {
      if (i % every) continue;
      const dd = new Date(d);
      svg += `<line x1="${x(d)}" x2="${x(d)}" y1="${H - pb}" y2="${H - pb + 4}" stroke="var(--muted)"/>`;
      svg += `<text x="${x(d)}" y="${H - pb + 18}" text-anchor="middle" font-size="11" fill="var(--muted)">${dd.getMonth() + 1}/${dd.getDate()}</text>`;
    }
    svg += `<line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="var(--muted)" stroke-width="1"/>`;
    const ends = [];
    for (const s of series) {
      if (!s.pts.length) continue;
      const col = `var(--${s.id === 'ane' ? 'ane' : 'imo'})`;
      if (s.pts.length > 1) svg += `<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${s.pts.map(p => `${x(p.t).toFixed(1)},${y(p.g).toFixed(1)}`).join(' ')}"/>`;
      s.pts.forEach((p, k) => {
        const last = k === s.pts.length - 1;
        svg += `<circle cx="${x(p.t)}" cy="${y(p.g)}" r="${last ? 5 : 3.5}" fill="${last ? col : 'var(--surface)'}" stroke="${col}" stroke-width="2"><title>${fmtG(p.g)}g</title></circle>`;
      });
      const lp = s.pts[s.pts.length - 1];
      ends.push({ id: s.id, col, x: x(lp.t), y: y(lp.g), g: lp.g });
    }
    if (ends.length === 2 && Math.abs(ends[0].y - ends[1].y) < 30) {
      const [a, b] = ends[0].y <= ends[1].y ? [ends[0], ends[1]] : [ends[1], ends[0]];
      const mid = (a.y + b.y) / 2; a.ly = mid - 15; b.ly = mid + 15;
    }
    for (const e of ends) {
      const ly = e.ly ?? e.y;
      svg += `<text x="${e.x + 10}" y="${ly - 2}" font-size="12" font-weight="700" fill="${e.col}">${esc(baby(e.id).name)}</text>`;
      svg += `<text x="${e.x + 10}" y="${ly + 13}" font-size="12" fill="var(--ink)" class="num">${fmtG(e.g)}g</text>`;
    }
    svg += '</svg>';
    $('#chart').innerHTML = svg;
  }

  // ---------- alarm state (header pill + the block in 設定) ----------
  let wakeLock = null;
  function alarmBlockHTML() {
    const leadTxt = S.alarm.lead ? L(`予定の${S.alarm.lead}分前`, `預定前${S.alarm.lead}分鐘`) : L('予定時刻', '預定時間');
    const state = S.alarm.active
      ? L(`オン：${leadTxt}に音とバイブでお知らせします。画面のスリープ防止は${wakeLock ? 'オン' : 'この端末では使えません'}。`,
          `已開啟：會在${leadTxt}以聲音和震動提醒。螢幕防休眠：${wakeLock ? '已開啟' : '此裝置不支援'}。`)
      : L('オフです。オンにすると、次の授乳時刻に音とバイブでお知らせします。', '目前關閉。開啟後會在下次餵奶時以聲音和震動提醒。');

      <div class="row"><button type="button" class="btn" data-act="test">${L('音を試す', '試聽聲音')}</button>${S.alarm.active
        ? `<button type="button" class="btn ghost" data-act="alarm-off">${L('オフにする', '關閉')}</button>`
        : `<button type="button" class="btn solid" data-act="alarm-on">${L('オンにする', '開啟')}</button>`}</div>`;
  }
  function renderAlarmBar() {
    const el = $('#alarm-pill');
