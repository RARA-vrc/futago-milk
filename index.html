    el.textContent = S.alarm.active ? L('アラーム オン', '提醒 開') : L('アラーム オフ', '提醒 關');
    const blk = $('#alarm-block'); if (blk) blk.innerHTML = alarmBlockHTML();
  }

  // ---------- sound ----------
  let actx = null;
  function ensureAudio() {
    try {
      if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
      if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    } catch {}
    return actx;
  }
  function chime() {
    const c = ensureAudio(); if (!c) return;
    const t = c.currentTime;
    [[0, 880], [0.2, 1175], [0.4, 1568], [0.9, 880], [1.1, 1175], [1.3, 1568]].forEach(([dt, f]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + dt);
      g.gain.exponentialRampToValueAtTime(0.5, t + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.45);
      o.connect(g); g.connect(c.destination);
      o.start(t + dt); o.stop(t + dt + 0.5);
    });
  }
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; renderAlarmBar(); });
      }
    } catch { wakeLock = null; }
    renderAlarmBar();
  }
  function alarmOn(withTest) {
    ensureAudio();
    if (withTest) chime();
    S.alarm.active = true; S.alarm.pref = true; lsSet('futago-alarm-pref', true);
    // Treat already-overdue feeds at the moment of turning on as acknowledged only if user tests; otherwise ring.
    requestWakeLock();
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {}); } catch {}
    renderAlarmBar(); tick();
  }
  function alarmOff() {
    S.alarm.active = false; S.alarm.pref = false; lsSet('futago-alarm-pref', false);
    try { wakeLock && wakeLock.release(); } catch {}
    wakeLock = null; S.ringing = []; renderRing(); renderAlarmBar();
  }
  // Sound needs a tap after each page load, so the first tap anywhere resumes an alarm that was on.
  document.addEventListener('pointerdown', () => {
    if (S.alarm.pref && !S.alarm.active) alarmOn(false);
  }, { capture: true });

  // ---------- tabs ----------
  function applyTab() {
    document.querySelectorAll('.view').forEach(v => { v.hidden = v.dataset.view !== S.tab; });
    document.querySelectorAll('#tabs button').forEach(b => {
      if (b.dataset.tab === S.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (S.alarm.active && !wakeLock) requestWakeLock(); tick(); }
  });

  // ---------- ringing ----------
  let ringTimer = null;
  function checkAlarms(now) {
    const want = [];
    if (S.alarm.active) {
      for (const id of BABY_IDS) {
        const n = nextAt(id); if (!n) continue;
        if (now >= n - S.alarm.lead * MIN && S.alarm.ack[id] !== n && now >= (S.alarm.snooze[id] || 0)) want.push(id);
      }
    }
    const fresh = want.filter(id => !S.ringing.includes(id));
    const changed = fresh.length || want.length !== S.ringing.length;
    S.ringing = want;
    if (fresh.length) notify(fresh);
    if (changed) renderRing();
  }
  function notify(ids) {
    const names = ids.map(id => baby(id).name).join(L('と', '和'));
    try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch {}
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification(L('ミルクの時間です', '餵奶時間到了'), { body: L(`${names}の授乳時刻になりました`, `${names}該餵奶了`), tag: 'futago-' + ids.join('-') }); } catch {}
  }
  const appTitle = () => L('ふたごミルク帳', '雙胞胎餵奶紀錄');
  function renderRing() {
    const root = $('#ring-root');
    if (!S.ringing.length) {
      root.innerHTML = ''; if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
      document.title = appTitle(); return;
    }
    document.title = L('【ミルクの時間】', '【餵奶時間】') + appTitle();
    if (!ringTimer) { chime(); ringTimer = setInterval(() => { chime(); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {} }, 3000); }
    const now = Date.now();
    root.innerHTML = `<div class="ring" role="alertdialog" aria-label="${L('授乳アラーム', '餵奶提醒')}"><div class="ring-inner">${S.ringing.map(id => {
      const b = baby(id), n = nextAt(id), m = lastOf(id, 'milk');
      const when = now >= n
        ? L(`予定 ${fmtT(n)}（${durText(now - n)}経過）`, `預定 ${fmtT(n)}（已過 ${durText(now - n)}）`)
        : L(`予定 ${fmtT(n)}（あと${durText(n - now)}）`, `預定 ${fmtT(n)}（還有 ${durText(n - now)}）`);
      return `<div class="ring-item">${baby(id).photo ? `<img class="avatar xl" src="${baby(id).photo}" alt="">` : ''}<h2>${L(`${esc(b.name)}のミルクの時間です`, `${esc(b.name)}的餵奶時間到了`)}</h2>
        <p class="num">${when}<br>${L('前回', '上次')} ${fmtT(m.at)} ${esc(milkText(m))}</p>
        <div class="row">
          <button type="button" class="primary" data-ring="record" data-baby="${id}">${L('授乳を記録する', '記錄餵奶')}</button>
          <button type="button" data-ring="snooze" data-baby="${id}">${L('5分後にもう一度', '5分鐘後再提醒')}</button>
          <button type="button" data-ring="stop" data-baby="${id}">${L('止める', '停止')}</button>
        </div></div>`;
    }).join('')}</div></div>`;
  }
  function ack(id) { S.alarm.ack[id] = nextAt(id); lsSet('futago-alarm-ack', S.alarm.ack); }

  // ---------- tick ----------
  let planMinute = 0;
  function tick() {
    const now = Date.now();
    $('#clock').textContent = fmtT(now);
    // The timetable's "あと…" and the いま line move once a minute.
    if (S.tab === 'plan' && Math.floor(now / MIN) !== planMinute) { planMinute = Math.floor(now / MIN); renderPlan(); }
    for (const id of BABY_IDS) {
      const cd = document.querySelector(`[data-cd="${id}"]`); if (!cd) continue;
      const bar = document.querySelector(`[data-bar="${id}"]`), sub = document.querySelector(`[data-cdsub="${id}"]`);
      const m = lastOf(id, 'milk'), b = baby(id);
      if (!m) {
        cd.className = 'cd empty'; cd.textContent = S.mode === 'loading' ? L('読み込み中…', '載入中…') : L('最初の授乳を記録すると、ここに次の時間が出ます', '記錄第一次餵奶後，這裡會顯示下次時間');
        bar.className = 'bar'; bar.firstElementChild.style.width = '0'; sub.textContent = ''; continue;
      }
      const n = m.at + b.intervalH * HOUR, frac = Math.min(1, (now - m.at) / (b.intervalH * HOUR));
      const dayTag = startOfDay(n) > startOfDay(now) ? `<small>${L('翌日', '隔天')}</small>` : '';
      if (now < n) { cd.className = 'cd'; cd.innerHTML = `${dayTag}<b>${fmtT(n)}</b><span class="cd-rel">${L('あと', '還有')} ${durText(n - now)}</span>`; bar.className = 'bar'; }
      else { cd.className = 'cd due'; cd.innerHTML = `<b>${fmtT(n)}</b><span class="cd-rel">${L(`予定から ${durText(now - n)} すぎています`, `已超過預定 ${durText(now - n)}`)}</span>`; bar.className = 'bar due'; }
      bar.firstElementChild.style.width = (Math.max(0, frac) * 100).toFixed(1) + '%';
      sub.textContent = L(`前回 ${fmtT(m.at)}・${milkText(m)}（${durText(now - m.at)}前）`, `上次 ${fmtT(m.at)}・${milkText(m)}（${durText(now - m.at)}前）`);
    }
    checkAlarms(now);
  }
  setInterval(tick, 1000);

        ${w ? `<p class="hint">${L('前回', '上次')}：${fmtG(w.grams)}g（${new Date(w.at).getMonth() + 1}/${new Date(w.at).getDate()}）</p>` : ''}</div>`;
      if (!F.editing) body += `<details class="more-fields" ${F.height || F.head ? 'open' : ''}><summary>${L('身長・頭囲も記録する（健診などで測ったとき）', '同時記錄身長・頭圍（健檢時測量）')}</summary>${measureFields(F)}</details>`;

      const t = Number(F.temp) || 36.8, lv = tempLevel(t), ageDays = baby(F.baby).birthAt ? dayAge(baby(F.baby).birthAt) : null;
      const opts = []; for (let v = 35.0; v <= 41.05; v += 0.1) opts.push(Math.round(v * 10) / 10);
      body += `<div class="field"><label for="f-temp">${L('体温（℃）', '體溫（℃）')}</label>
          <div class="stepper"><button type="button" data-step="temp:-0.1">−0.1</button><select class="mlsel temp-sel ${lv}" id="f-temp">${opts.map(v => `<option value="${v}" ${Math.abs(v - t) < 0.01 ? 'selected' : ''}>${v.toFixed(1)} ℃</option>`).join('')}</select><button type="button" data-step="temp:0.1">+0.1</button></div>
          ${lv === 'hot' && ageDays !== null && ageDays < 91 ? `<p class="caution">${L('生後3か月未満で38℃以上の発熱は、夜間でも早めに小児科へ相談してください（#8000 こども医療電話相談）。', '未滿3個月的寶寶發燒38℃以上，即使是夜間也請盡早諮詢小兒科。')}</p>` : ''}</div>
        <div class="field"><span class="lbl">${L('体調（あてはまるものを選択）', '身體狀況（可複選）')}</span>
          <div class="chips">${Object.entries(SYMPTOMS).map(([k, label]) => `<button type="button" data-sym="${k}" aria-pressed="${(F.sym || []).includes(k)}">${esc(label)}</button>`).join('')}</div></div>`;
    }
    const title = (F.editing ? L('修正：', '修改：') : '') + TYPE_LABEL[F.type];
    root.innerHTML = `<div class="overlay" data-act="close-bg"><form class="sheet" id="sheet" novalidate>
      <div class="sheet-head"><h2>${title}</h2><button type="button" class="icon-btn" data-act="close">${L('閉じる', '關閉')}</button></div>
      <div class="field"><span class="lbl">${L('だれ', '誰')}</span><div class="chips who" role="group">${BABY_IDS.map(id => `<button type="button" data-who="${id}" data-baby="${id}" aria-pressed="${F.baby === id}">${esc(baby(id).name)}</button>`).join('')}</div></div>

      <div class="field"><span class="lbl">${L('時刻', '時間')}</span>${tpHTML('f', F.at, true)}</div>

      <div class="field"><label for="f-note">${L('メモ（任意）', '備註（選填）')}</label><input type="text" id="f-note" maxlength="200" value="${esc(F.note)}" placeholder="${L('吐き戻し、飲みムラなど', '吐奶、沒喝完等')}"></div>
      <div class="sheet-actions">
        ${F.editing ? (F.confirmDelete
          ? `<button type="button" class="btn danger" data-act="delete-yes">${L('本当に削除する', '確定刪除')}</button><button type="button" class="btn ghost" data-act="delete-no">${L('やめる', '不刪除')}</button>`

        <button type="button" class="btn ghost" data-act="close">${L('キャンセル', '取消')}</button>
        <button type="submit" class="btn solid" id="f-save">${L('保存', '儲存')}</button>
      </div>

  }

  function measureFields(F) {
    const last = measuresOf(F.baby).find(l => l.id !== F.editing && (l.height || l.head));
    return `<div class="two-col">
      <div class="field"><label for="f-h">${L('身長（cm）', '身長（cm）')}</label><input type="number" inputmode="decimal" step="0.1" min="30" max="120" id="f-h" value="${esc(F.height ?? '')}"></div>
      <div class="field"><label for="f-hc">${L('頭囲（cm）', '頭圍（cm）')}</label><input type="number" inputmode="decimal" step="0.1" min="25" max="60" id="f-hc" value="${esc(F.head ?? '')}"></div>
    </div>${last ? `<p class="hint">${L('前回', '上次')}：${describe(last)}（${new Date(last.at).getMonth() + 1}/${new Date(last.at).getDate()}）</p>` : ''}`;
  }

  function nextPreview() {
    const F = S.form, b = baby(F.baby), n = F.at + b.intervalH * HOUR;
    const tag = startOfDay(n) > startOfDay(F.at) ? L('翌日 ', '隔天 ') : '';
    return L(`次の授乳は ${tag}<b>${fmtT(n)}</b>（${b.intervalH}時間後）。アラームがオンならこの時刻に鳴ります。`,
      `下次餵奶是 ${tag}<b>${fmtT(n)}</b>（${b.intervalH}小時後）。提醒開啟時會在這個時間響起。`);
  }

  async function submitForm() {
    readForm();
    const F = S.form; if (!F) return;
    const now = Date.now();
    if (!F.at || F.at > now + FUTURE_OK) return toast(L('時刻を確認してください（未来の時刻は記録できません）。', '請確認時間（無法記錄未來的時間）。'));
    const data = { baby: F.baby, type: F.type, at: F.at, note: (F.note || '').trim(), updatedAt: now };
    if (F.type === 'milk') {
      data.kind = F.kind;
      if (F.kind === 'breast') { if (!(F.min >= 1 && F.min <= 90)) return toast(L('授乳時間は1〜90分で入力してください。', '餵奶時間請輸入1〜90分鐘。')); data.min = F.min; }
      else { if (!(F.ml >= 1 && F.ml <= 300)) return toast(L('量は1〜300mLで入力してください。', '奶量請輸入1〜300mL。')); data.ml = F.ml; }
    } else if (F.type === 'poo') {
      data.color = F.color; data.amount = F.amount;
    } else if (F.type === 'weight') {
      if (!(F.grams >= 500 && F.grams <= 15000)) return toast(L('体重は500〜15,000gで入力してください。', '體重請輸入500〜15,000g。'));
      data.grams = F.grams;
    } else if (F.type === 'temp') {
      if (!(F.temp >= 34 && F.temp <= 42)) return toast(L('体温を確認してください。', '請確認體溫。'));
      data.temp = Math.round(F.temp * 10) / 10; data.sym = F.sym || [];
    }
    // Height / head circumference: the measure form, or the optional fields inside the weight form.
    let measure = null;
    if (F.type === 'measure' || (F.type === 'weight' && !F.editing && (F.height || F.head))) {
      if (F.height !== '' && F.height != null && !(F.height >= 30 && F.height <= 120)) return toast(L('身長は30〜120cmで入力してください。', '身長請輸入30〜120cm。'));
      if (F.head !== '' && F.head != null && !(F.head >= 25 && F.head <= 60)) return toast(L('頭囲は25〜60cmで入力してください。', '頭圍請輸入25〜60cm。'));
      if (!F.height && !F.head) { if (F.type === 'measure') return toast(L('身長か頭囲を入力してください。', '請輸入身長或頭圍。')); }
      else measure = { baby: F.baby, type: 'measure', at: F.at, note: F.type === 'measure' ? data.note : '', updatedAt: now, ...(F.height ? { height: F.height } : {}), ...(F.head ? { head: F.head } : {}) };
      if (F.type === 'measure') Object.assign(data, measure);
    }
    const prevLast = lastOf(F.baby, 'milk');
    const isLatestMilk = F.type === 'milk' && (!prevLast || prevLast.id === F.editing || F.at >= prevLast.at);
    const editingId = F.editing || null;
    const before = editingId ? S.logs.find(l => l.id === editingId) : null;
    const btn = $('#f-save'); if (btn) { btn.disabled = true; btn.textContent = L('保存中…', '儲存中…'); }
    try {
      const savedIds = [await saveLog(editingId, data)];
      if (F.type === 'poo' && !editingId && F.withPee) savedIds.push(await saveLog(null, { baby: F.baby, type: 'pee', at: F.at, note: '', updatedAt: now }));
      if (F.type === 'weight' && measure) savedIds.push(await saveLog(null, measure));
      if (F.type === 'milk') S.ringing = S.ringing.filter(id => id !== F.baby);
      if (isLatestMilk && IS_IOS && lsGet('futago-ios-auto', false) && lsGet('futago-shortcut-ready', false)) {
        startIphoneTimer(data.at + baby(data.baby).intervalH * HOUR);
      }
      S.form = null; renderForm();
      const nb = baby(data.baby);
      // "取り消す" puts things back: a new record is deleted, an edited one gets its old values.
      const undo = editingId
        ? () => { if (!before) return; const { id: _drop, ...prev } = before; saveLog(editingId, prev).then(() => toast(L('修正を取り消しました', '已復原修改'))); }
        : () => { savedIds.forEach(id => deleteLog(id)); toast(L('記録を取り消しました', '已取消這筆紀錄')); };
      const verb = editingId ? L('修正しました', '修改') : L('記録しました', '記錄');
      const nextT = fmtT(data.at + nb.intervalH * HOUR);
      toast(isLatestMilk
        ? L(`${nb.name}の授乳を${verb}。次は ${nextT} です`, `已${verb}${nb.name}的餵奶。下次是 ${nextT}`)
        : L(`${nb.name}の${TYPE_LABEL[data.type]}を${verb}`, `已${verb}${nb.name}的${TYPE_LABEL[data.type]}`), { label: L('取り消す', '復原'), fn: undo });
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = L('保存', '儲存'); }
      toast(errMsg(e));
    }
  }

  // ---------- settings ----------
  const INTERVAL_CHOICES = [2, 2.5, 3, 3.5, 4, 4.5, 5];
  function openSettings(only) {

        <div class="settings-block"><h3>言語 / 語言</h3>${langSwitchHTML()}<p class="hint">${L('この端末だけの設定です。', '只會套用在此裝置。')}</p></div>
        <div class="settings-block" id="alarm-block">${alarmBlockHTML()}</div>

            <select id="s-lead">${[0, 5, 10, 15, 20, 25, 30, 45, 60].map(m => `<option value="${m}" ${S.alarm.lead === m ? 'selected' : ''}>${m ? L(`予定の${m}分前`, `預定前${m}分鐘`) : L('予定時刻ちょうど', '預定時間準時')}</option>`).join('')}</select></div>
          ${IS_IOS ? `<div class="field"><span class="lbl">${L('iPhone のタイマー（この端末）', 'iPhone 計時器（此裝置）')}</span>

            <button type="button" class="btn ghost" data-act="shortcut-help">${L('ショートカットの作り方を見る', '查看捷徑製作方法')}</button></div>` : ''}
        </div>`}
      ${ids.map(id => { const b = baby(id); return `<div class="settings-baby">
        <h3>${id === 'ane' ? L('姉', '姊姊') : L('妹', '妹妹')}</h3>

          <div class="row">${avatarHTML(id, 'lg', true)}<button type="button" class="btn ghost" data-photo="${id}">${b.photo ? L('写真を変更', '更換照片') : L('写真を選ぶ', '選擇照片')}</button></div></div>
        <div class="field wide"><label for="s-${id}-name">${L('呼び名', '稱呼')}</label><input type="text" id="s-${id}-name" maxlength="12" value="${esc(b.name)}"></div>
        <div class="field wide"><label for="s-${id}-int">${L('授乳の間隔（何時間ごと）', '餵奶間隔（每幾小時）')}</label>

          <input type="number" inputmode="decimal" step="0.25" min="1" max="8" id="s-${id}-int" value="${b.intervalH}">

        <div class="field"><label for="s-${id}-min">${L('量の目安 下限（mL）', '參考量 下限（mL）')}</label><input type="number" inputmode="numeric" min="5" max="300" id="s-${id}-min" value="${b.minMl}"></div>
        <div class="field"><label for="s-${id}-max">${L('上限（mL）', '上限（mL）')}</label><input type="number" inputmode="numeric" min="5" max="300" id="s-${id}-max" value="${b.maxMl}"></div>
      </div>`; }).join('')}
      <p class="hint">${L('間隔や量の目安は、医師・助産師の指示に合わせて変更してください。', '間隔與參考量請依醫師或助產師的指示調整。')}</p>
      <div class="sheet-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-act="close">${L('キャンセル', '取消')}</button><button type="submit" class="btn solid" id="f-save">${L('保存', '儲存')}</button></div>
    </form></div>`;
  }
  async function submitSettings() {
    if ($('#s-lead')) { const lead = Number($('#s-lead').value) || 0; S.alarm.lead = lead; lsSet('futago-alarm-lead', lead); }
    if ($('#s-iosauto')) lsSet('futago-ios-auto', $('#s-iosauto').checked);
    try {
      for (const id of (S.form.only ? [S.form.only] : BABY_IDS)) {
        let name = $(`#s-${id}-name`).value.trim() || DEFAULTS[id].name;
        // Keep the shared default stored as 姉/妹 so each device shows it in its own language.
        if (name === ZH_DEFAULT_NAME[id]) name = DEFAULTS[id].name;
        const intervalH = Number($(`#s-${id}-int`).value);
        let minMl = Number($(`#s-${id}-min`).value), maxMl = Number($(`#s-${id}-max`).value);
        if (!(intervalH >= 1 && intervalH <= 8)) return toast(L('授乳の間隔は1〜8時間で入力してください。', '餵奶間隔請輸入1〜8小時。'));
        if (!(minMl >= 5 && maxMl >= 5 && minMl <= 300 && maxMl <= 300)) return toast(L('量の目安は5〜300mLで入力してください。', '參考量請輸入5〜300mL。'));
        if (minMl > maxMl) [minMl, maxMl] = [maxMl, minMl];
        const next = { name, intervalH, minMl, maxMl };
        const cur = { ...DEFAULTS[id], ...(S.babies[id] || {}) };
        if (cur.name !== name || cur.intervalH !== intervalH || cur.minMl !== minMl || cur.maxMl !== maxMl) await saveBaby(id, next);
      }
      S.form = null; renderForm(); render(); toast(L('設定を保存しました', '已儲存設定'));
    } catch (e) { toast(errMsg(e)); }
  }

  // ---------- backfill: record several past feeds at once (e.g. night feeds someone else gave) ----------
  // Rows start as the feeds that were due since each twin's last record, at the target amount.
  // A row within 20 minutes of a feed already recorded starts unchecked so nothing is doubled.
  const NEAR_GAP = 20 * MIN, BATCH_MAX_PER_BABY = 8;
  let batchSeq = 0;
  const isNearRecorded = (id, at) => S.logs.some(l => l.baby === id && l.type === 'milk' && Math.abs(l.at - at) < NEAR_GAP);
  function batchRow(id, at) {
    const near = isNearRecorded(id, at);
    return { key: 'r' + (++batchSeq), baby: id, at, ml: lastMl(id), on: !near, near };
  }
  function batchRowsDefault() {
    const now = Date.now(), rows = [];
    for (const id of BABY_IDS) {
      const last = lastOf(id, 'milk'), step = baby(id).intervalH * HOUR;
      if (!last) continue;
      for (let t = last.at + step, k = 0; t <= now && k < BATCH_MAX_PER_BABY; t += step, k++) rows.push(batchRow(id, roundQ(t)));
    }
    if (!rows.length) BABY_IDS.forEach(id => rows.push(batchRow(id, nowQ())));
    return rows;
  }
  function openBatch() {
    S.form = { type: 'batch', kind: 'formula', rows: batchRowsDefault(), open: null };
    renderBatch();
  }
  function readBatch() {
    const F = S.form; if (!F || F.type !== 'batch') return;
    for (const r of F.rows) {
      const on = document.getElementById(`b-on-${r.key}`), ml = document.getElementById(`b-ml-${r.key}`);
      if (on) r.on = on.checked;
      if (ml) r.ml = Number(ml.value);
      r.near = isNearRecorded(r.baby, r.at);
    }
  }
  function renderBatch() {
    const F = S.form;
    F.rows.sort((a, b) => a.at - b.at);
    $('#sheet-root').innerHTML = `<div class="overlay" data-act="close-bg"><form class="sheet" id="sheet" novalidate>
      <div class="sheet-head"><h2>${L('あとからまとめて記録', '事後補記餵奶')}</h2><button type="button" class="icon-btn" data-act="close">${L('閉じる', '關閉')}</button></div>
      <p class="hint">${L('最後の記録から今までの予定時刻を入れてあります。実際に飲んだ時刻と量に直し、飲まなかった行はチェックを外してください。', '已填入從最後一筆紀錄到現在的預定時間。請改成實際餵奶的時間與奶量，沒有餵的請取消勾選。')}</p>
      <div class="field"><span class="lbl">${L('種類', '種類')}</span>${chipsHTML('bkind', { formula: KIND.formula, expressed: KIND.expressed }, F.kind)}</div>
      <div>
        <div class="brow head" aria-hidden="true"><span></span><span>${L('だれ', '誰')}</span><span>${L('時刻', '時間')}</span><span>mL</span><span></span></div>
        ${F.rows.map(r => `<div class="brow${r.on ? '' : ' off'}">
          <input type="checkbox" class="bon" id="b-on-${r.key}" ${r.on ? 'checked' : ''} aria-label="${L('この行を記録する', '記錄這一筆')}">
          <button type="button" class="chip ${r.baby}" data-bbaby="${r.key}" aria-label="${L('子を切り替え', '切換寶寶')}">${esc(baby(r.baby).name)}</button>
          <div class="bt"><button type="button" class="tbtn" data-bopen="${r.key}" aria-expanded="${F.open === r.key}">${tpLabel(r.at)}</button></div>
          <select class="mlsel" id="b-ml-${r.key}" aria-label="mL">${mlOptions(r.ml, true)}</select>
          <button type="button" class="bdel" data-bdel="${r.key}" aria-label="${L('この行を消す', '刪除這一列')}">×</button>
          ${F.open === r.key ? `<div class="brow-tp">${tpHTML('b:' + r.key, r.at, true)}</div>` : ''}
          ${r.near ? `<span class="bnear">${L('すでに記録がある時刻と近いです。二重に記録しないようご注意ください', '和已記錄的時間很接近，請注意不要重複記錄')}</span>` : ''}
        </div>`).join('')}
      </div>
      <div class="badd">${BABY_IDS.map(id => `<button type="button" class="btn ghost" data-badd="${id}">${L(`＋ ${esc(baby(id).name)}の行を追加`, `＋ 新增${esc(baby(id).name)}的一列`)}</button>`).join('')}</div>
      <div class="sheet-actions"><span class="spacer"></span>
        <button type="button" class="btn ghost" data-act="close">${L('キャンセル', '取消')}</button>
        <button type="submit" class="btn solid" id="f-save">${L(`${F.rows.filter(r => r.on).length}件を記録`, `記錄${F.rows.filter(r => r.on).length}筆`)}</button>
      </div>
    </form></div>`;
  }
  // Ticking a row on/off updates its dimming and the save button's count.
  document.addEventListener('change', e => {
    if (!S.form || S.form.type !== 'batch') return;
    if (e.target.classList.contains('bon')) { readBatch(); renderBatch(); }
  });
  async function submitBatch() {
    readBatch();
    const F = S.form, now = Date.now(), rows = F.rows.filter(r => r.on);
    if (!rows.length) return toast(L('記録する行がありません。', '沒有要記錄的項目。'));
    for (const r of rows) {
      if (!(r.ml >= 1 && r.ml <= 300)) return toast(L('量は1〜300mLで入力してください。', '奶量請輸入1〜300mL。'));
      if (!r.at || r.at > now + FUTURE_OK) return toast(L('時刻を確認してください（未来の時刻は記録できません）。', '請確認時間（無法記錄未來的時間）。'));
    }
    const ids = [];
    try {
      for (const r of rows) {
        ids.push(await saveLog(null, { baby: r.baby, type: 'milk', at: r.at, kind: F.kind, ml: r.ml, note: '', updatedAt: now }));
      }
    } catch (e) { return toast(errMsg(e)); }
    S.form = null; renderForm();
    toast(L(`${ids.length}件の授乳を記録しました`, `已記錄${ids.length}筆餵奶`), {
      label: L('取り消す', '復原'),
      fn: () => { ids.forEach(id => deleteLog(id)); toast(L('まとめて記録した分を取り消しました', '已取消這次補記的紀錄')); },
    });
  }

  // ---------- iPhone timer (via the Shortcuts app) ----------
  // A web page cannot drive the Clock app, so it runs a user-made shortcut named
  // SHORTCUT_NAME and hands it the minutes until the next feed; the shortcut's single
  // "タイマーを開始" action starts the timer with that many minutes.
  // The timer rings S.alarm.lead minutes before the feed (same setting as the in-page alarm).
  // If that moment has already passed, it falls back to the feed time itself.
  function iphoneTimerMinutes(at, now = Date.now()) {
    const early = Math.ceil((at - S.alarm.lead * MIN - now) / MIN);
    if (early > 0) return { min: early, early: true };
    const toFeed = Math.ceil((at - now) / MIN);
    return { min: toFeed, early: false };
  }
  function startIphoneTimer(at) {
    const { min, early } = iphoneTimerMinutes(at);
    if (min <= 0) return toast(L('次のミルクの時刻はもう過ぎています。', '下次餵奶時間已經過了。'));
    if (!early && S.alarm.lead) toast(L(`${S.alarm.lead}分前はもう過ぎているので、予定時刻までの${min}分でセットします`, `已經過了預定前${S.alarm.lead}分鐘，改設定到預定時間的${min}分鐘`));
    location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_NAME)}&input=text&text=${min}`;
  }
  function setIphoneTimer(id) {
    const n = nextAt(id);
    if (!n) return toast(L('先に授乳を記録してください。次のミルクまでの時間でタイマーをセットします。', '請先記錄餵奶，才能依下次餵奶時間設定計時器。'));
    if (!lsGet('futago-shortcut-ready', false)) return openShortcutHelp(id);
    startIphoneTimer(n);
  }
  function openShortcutHelp(id) {
    S.form = { type: 'shortcut', baby: id };
    renderShortcutHelp();
  }
  function renderShortcutHelp() {
    const id = S.form.baby;
    const copyBtn = `<button type="button" class="fix-last" data-act="copy-shortcut">${L('コピー', '複製')}</button>`;
    $('#sheet-root').innerHTML = `<div class="overlay" data-act="close-bg"><div class="sheet" role="dialog" aria-label="${L('iPhone のタイマー連携', 'iPhone 計時器連動')}">
      <div class="sheet-head"><h2>${L('iPhone のタイマー連携', 'iPhone 計時器連動')}</h2><button type="button" class="icon-btn" data-act="close">${L('閉じる', '關閉')}</button></div>
      <p class="hint">${L('最初に1回だけ、iPhone の「ショートカット」アプリでタイマー用のショートカットを作ります（2分ほど）。', '第一次使用時，請在 iPhone 的「捷徑」App 建立一個計時器用的捷徑（約2分鐘）。')}</p>
      <ol class="steps">${L(`
        <li>「ショートカット」アプリを開き、右上の <b>＋</b> で新しいショートカットを作ります。</li>
        <li>名前を <code>${SHORTCUT_NAME}</code> ${copyBtn} にします（一字一句このとおりに）。</li>
        <li>「アクションを追加」で <b>タイマー</b> と検索し、<b>「タイマーを開始」</b>を追加します。</li>
        <li>「30 分」の数字の部分をタップし、変数の <b>「ショートカットの入力」</b> を選びます。単位は <b>分</b> のままにします。</li>
        <li>右上の「完了」で保存します。</li>`, `
        <li>打開「捷徑」App，點右上角的 <b>＋</b> 新增捷徑。</li>
        <li>把名稱設為 <code>${SHORTCUT_NAME}</code> ${copyBtn}（請完全照這樣輸入，可以點「複製」後貼上）。</li>
        <li>點「加入動作」，搜尋 <b>計時器</b>，加入 <b>「開始計時器」</b>。</li>
        <li>點「30 分鐘」的數字部分，選擇變數 <b>「捷徑輸入」</b>，單位保持 <b>分鐘</b>。</li>
        <li>點右上角的「完成」儲存。</li>`)}
      </ol>
      <p class="hint">${L('初回は「"ショートカット"で開きますか？」などの確認が出るので、「開く」「許可」を選んでください。ショートカットはご夫婦それぞれの iPhone で作る必要があります。', '第一次執行時會出現「要用"捷徑"打開嗎？」等確認，請選「打開」「允許」。兩個人的 iPhone 都需要各自建立這個捷徑。')}</p>
      <div class="sheet-actions"><span class="spacer"></span>
        <button type="button" class="btn ghost" data-act="close">${L('あとで', '稍後')}</button>
        <button type="button" class="btn solid" data-act="shortcut-ready">${id ? L('作った・タイマーをセット', '建好了・設定計時器') : L('作った', '建好了')}</button>
      </div>
    </div></div>`;
  }

  // ---------- toast ----------
  let toastTimer = null, toastAction = null;
  function toast(msg, action) {
    const root = $('#toast-root');
    toastAction = action ? action.fn : null;
    root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action ? `<button type="button" class="toast-btn" data-act="toast-action">${esc(action.label)}</button>` : ''}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { root.innerHTML = ''; toastAction = null; }, action ? 8000 : 3800);
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    // A tapped day in the per-feed milk chart (SVG, so not a button) lists that day's feeds below it.
    const bar = e.target.closest('[data-tday]');
    if (bar) { S.trendDay = Number(bar.getAttribute('data-tday')); return renderTrend(); }
    const t = e.target.closest('button, [data-act="close-bg"]');
    if (!t) return;
    const d = t.dataset;
    if (d.act === 'close-bg') { if (e.target === t) { S.form = null; renderForm(); } return; }
    if (d.lang) return setLang(d.lang);
    if (d.tp) {
      const parts = d.tp.split(':'), op = parts.pop(), [scope, key] = parts;
      if (scope === 'f' && S.form) { readForm(); S.form.at = tpApply(S.form.at, op); return renderForm(); }
      if (scope === 'b' && S.form && S.form.type === 'batch') {
        readBatch(); const r = S.form.rows.find(x => x.key === key);
        if (r) { r.at = tpApply(r.at, op); r.near = isNearRecorded(r.baby, r.at); }
        return renderBatch();
      }
      if (scope === 's') { S.planStart[key] = tpApply(S.planStart[key], op); renderPlanSim(true); return renderPlan(); }
      return;
    }
    if (d.bopen) { readBatch(); S.form.open = S.form.open === d.bopen ? null : d.bopen; return renderBatch(); }
    if (d.sopen) {
      const id = d.sopen;
      // Opening an unset twin starts from its next scheduled feed (or now), on the quarter hour.
      if (!S.planStart[id]) S.planStart[id] = roundQ(nextAt(id) || Date.now());
      S.simOpen = S.simOpen === id ? null : id;
      renderPlanSim(true); return renderPlan();
    }
    if (S.form && S.form.type === 'batch') {
      const rows = S.form.rows;
      if (d.bkind) { readBatch(); S.form.kind = d.bkind; return renderBatch(); }
      if (d.bbaby) {
        readBatch(); const r = rows.find(x => x.key === d.bbaby);
        if (r) { r.baby = BABY_IDS[(BABY_IDS.indexOf(r.baby) + 1) % BABY_IDS.length]; r.ml = lastMl(r.baby); r.near = isNearRecorded(r.baby, r.at); }
        return renderBatch();
      }
      if (d.bdel) { readBatch(); S.form.rows = rows.filter(x => x.key !== d.bdel); return renderBatch(); }
      if (d.badd) { readBatch(); const r = batchRow(d.badd, nowQ()); S.form.rows.push(r); S.form.open = r.key; return renderBatch(); }
    }
    if (d.add) return openForm(d.add, d.baby);
    if (d.bset) return openSettings(d.bset);
    if (d.tab) {
      S.tab = d.tab; lsSet('futago-tab', S.tab); applyTab(); window.scrollTo(0, 0);
      // The timetable opens at the いま line rather than at 12 hours ago.
      if (S.tab === 'plan') { renderPlan(); const line = $('.plan-now'); if (line) line.scrollIntoView({ block: 'center' }); }
      return;
    }
    if (d.iostimer) return setIphoneTimer(d.iostimer);
    if (d.trend) { S.trendMode = d.trend; lsSet('futago-trend', d.trend); return renderTrend(); }
    if (d.tbaby) { S.trendBaby = d.tbaby; lsSet('futago-trend-baby', d.tbaby); return renderTrend(); }
    if (d.photo) return openPhoto(d.photo);
    if (d.gm) { S.gMetric = d.gm; lsSet('futago-gmetric', d.gm); renderWeights(); return renderChart(); }
    if (d.corr !== undefined) { S.corrected = d.corr === '1'; lsSet('futago-corrected2', S.corrected); renderBirthInfo(); return renderChart(); }
    if (d.ms) {
      // Tap toggles "できた" (dated today) ↔ "まだ" for that twin.
      const [id, key] = d.ms.split(':'), done = baby(id).ms && baby(id).ms[key];
      saveBaby(id, { ms: { [key]: done ? null : Date.now() } });   // the live snapshot redraws the list
      return;
    }
    if (d.int) {
      const [id, h] = d.int.split(':'), input = document.getElementById(`s-${id}-int`);
      if (input) input.value = h;
      t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
      return;
    }
    if (d.edit) { const l = S.logs.find(x => x.id === d.edit); if (l) openForm(l.type, l.baby, l); return; }
    if (d.filter) {
      S.filter = d.filter;
      document.querySelectorAll('#filter button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === S.filter)));
      return renderTimeline();
    }
    if (d.ring) {
      const id = d.baby;
      if (d.ring === 'stop') ack(id);
      else if (d.ring === 'snooze') S.alarm.snooze[id] = Date.now() + 5 * MIN;
      else if (d.ring === 'record') { S.alarm.snooze[id] = Date.now() + 3 * MIN; S.ringing = S.ringing.filter(x => x !== id); renderRing(); openForm('milk', id); return; }
      S.ringing = S.ringing.filter(x => x !== id); renderRing(); return;
    }
    switch (d.act) {
      case 'signin': return signIn();
      case 'signout': return signOut();
      case 'alarm-on': return alarmOn(true);
      case 'alarm-toggle':
        // Turning on is one tap; turning off goes through 設定 so a sleepy tap can't silence it.
        if (S.alarm.active) return openSettings();
        alarmOn(true); toast(L('アラームをオンにしました。この画面を開いたままにしてください', '已開啟提醒。請保持此畫面開啟')); return;
      case 'copy-shortcut':
        try {
          navigator.clipboard.writeText(SHORTCUT_NAME).then(() => toast(L('コピーしました', '已複製')), () => toast(SHORTCUT_NAME));
        } catch { toast(SHORTCUT_NAME); }
        return;
      case 'alarm-off': return alarmOff();
      case 'test': ensureAudio(); chime(); return;
      case 'toast-action': {
        const fn = toastAction; toastAction = null; clearTimeout(toastTimer); $('#toast-root').innerHTML = '';
        if (fn) fn();
        return;
      }
      case 'shortcut-help': return openShortcutHelp(null);
      case 'shortcut-ready': {
        lsSet('futago-shortcut-ready', true);
        const id = S.form && S.form.baby; S.form = null; renderForm();
        if (id) setIphoneTimer(id);
        return;
      }
      case 'sim-reset': S.planStart = {}; S.simOpen = null; renderPlanSim(true); return renderPlan();
      case 'sim-done': S.simOpen = null; return renderPlanSim(true);
      case 'sim-clear': delete S.planStart[S.simOpen]; S.simOpen = null; renderPlanSim(true); return renderPlan();
      case 'batch': return openBatch();
      case 'birth': return openBirth();
      case 'photo-remove': {
        const id = S.form.baby; saveBaby(id, { photo: null });
        S.form = null; renderForm(); toast(L('写真を外しました', '已移除照片')); return;
      }
      case 'more': S.daysShown += 7; return renderTimeline();
      case 'wmore': S.wShown += 20; return renderWeights();
      case 'close': S.form = null; return renderForm();
      case 'delete': readForm(); S.form.confirmDelete = true; return renderForm();
      case 'delete-no': readForm(); S.form.confirmDelete = false; return renderForm();
      case 'delete-yes': {
        const id = S.form.editing;
        deleteLog(id).then(() => { S.form = null; renderForm(); toast(L('記録を削除しました', '已刪除紀錄')); }).catch(err => toast(errMsg(err)));
        return;
      }
    }
    if (!S.form || S.form.type === 'settings') return;
    if (d.who) {
      readForm(); S.form.baby = d.who;
      if (S.form.type === 'milk' && !S.form.editing) S.form.ml = lastMl(d.who);   // follow the chosen twin's usual amount
      return renderForm();
    }
    if (d.kind) { readForm(); S.form.kind = d.kind; return renderForm(); }
    if (d.sym) {
      readForm(); const s = new Set(S.form.sym || []);
      s.has(d.sym) ? s.delete(d.sym) : s.add(d.sym); S.form.sym = [...s];
      return renderForm();
    }
    if (d.color) { readForm(); S.form.color = d.color; return renderForm(); }
    if (d.amount) { readForm(); S.form.amount = d.amount; return renderForm(); }
    if (d.ml) { readForm(); S.form.ml = Number(d.ml); return renderForm(); }
    if (d.step) {
      readForm(); const [k, n] = d.step.split(':');
      S.form[k] = Math.max(0, (Number(S.form[k]) || 0) + Number(n));
      if (k === 'ml') S.form.ml = Math.min(ML_MAX, Math.max(ML_MIN, S.form.ml));
      if (k === 'temp') S.form.temp = Math.min(41, Math.max(35, Math.round(S.form.temp * 10) / 10));
      return renderForm();
    }
  });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'sheet') return;
    e.preventDefault();
    if (S.form && S.form.type === 'settings') submitSettings();
    else if (S.form && S.form.type === 'batch') submitBatch();
    else if (S.form && S.form.type === 'birth') submitBirth();
    else if (S.form && S.form.type === 'photo') submitPhoto();
    else submitForm();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.form) { S.form = null; renderForm(); } });
  $('#open-settings').addEventListener('click', () => openSettings());

  applyLang();
  document.title = appTitle();
  applyTab();
  render();
  init();
})();
</script>
</body>
</html>
