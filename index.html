<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ふたごミルク帳</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E131B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ミルク帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: two side-by-side baby cards (stacked on phones) → timeline → weight chart. Large tap targets for night use. */
:root {
  --bg: #F2F4F7;
  --surface: #FFFFFF;
  --surface-2: #F7F8FA;
  --ink: #1B2230;
  --muted: #5D687A;
  --line: #DDE2EA;
  --ane: #C94A6E;
  --ane-soft: #FBE7ED;
  --imo: #23808A;
  --imo-soft: #DDF0F1;
  --danger: #C2362B;
  --danger-soft: #FCE6E3;
  --warn: #9A6A12;
  --warn-soft: #FBF0D9;
  --scrim: rgba(20, 26, 38, .45);
  --f-display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "BIZ UDPGothic", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #161D28; --surface-2: #1B2431; --ink: #E4E9F0; --muted: #94A0B2; --line: #283244;
    --ane: #EE8CA8; --ane-soft: #3A1F29; --imo: #5DC2C9; --imo-soft: #15302F;
    --danger: #FF8A7D; --danger-soft: #3D1C19; --warn: #E8BC62; --warn-soft: #33290F; --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #161D28; --surface-2: #1B2431; --ink: #E4E9F0; --muted: #94A0B2; --line: #283244;
  --ane: #EE8CA8; --ane-soft: #3A1F29; --imo: #5DC2C9; --imo-soft: #15302F;
  --danger: #FF8A7D; --danger-soft: #3D1C19; --warn: #E8BC62; --warn-soft: #33290F; --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--imo) 60%, transparent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.app {
  max-width: 1060px; margin: 0 auto;
  padding-block: 16px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.top h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.35rem; letter-spacing: .02em; }
.top-right { display: flex; align-items: center; gap: 8px; }
.clock { font-family: var(--f-display); font-size: 1.35rem; font-weight: 700; margin-right: 2px; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-height: 40px; padding: 0 12px; font-size: .88rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; min-height: 40px; padding: 0 12px; font-size: .82rem; font-weight: 700; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-soft); color: var(--warn); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.on { border-color: color-mix(in srgb, var(--imo) 45%, transparent); background: var(--imo-soft); color: var(--imo); }

/* tabs: a bottom bar on phones, a segmented row on wide screens */
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs button { border: none; background: transparent; color: var(--muted); font-family: var(--f-display); font-weight: 700; font-size: .95rem; min-height: 44px; border-radius: 10px; }
.tabs button[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
@media (min-width: 760px) {
  .tabs { max-width: 520px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
}
@media (max-width: 759px) {
  .app { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
    padding: 6px max(12px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  .tabs button { min-height: 50px; font-size: 1rem; }
  .tabs button[aria-current="page"] { background: var(--surface-2); box-shadow: none; }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)) !important; }
}
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 44px; padding: 0 16px; font-weight: 700; }
.btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: transparent; }

/* baby cards */
.babies { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.card { --c: var(--ane); --cs: var(--ane-soft); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.card[data-baby="imouto"] { --c: var(--imo); --cs: var(--imo-soft); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; background: var(--cs); }
.card-head h2 { margin: 0; font-family: var(--f-display); font-size: 1.45rem; font-weight: 700; color: var(--c); }
.next-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.next .rule { display: inline-flex; align-items: center; gap: 6px; border: none; background: transparent; padding: 2px 0; min-height: 32px; color: var(--muted); font-size: .8rem; }
.next .rule span { color: var(--c); font-weight: 700; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 99px; padding: 0 8px; font-size: .75rem; }
.next .rule:hover span { background: var(--cs); }
.last-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
.last-row .cd-sub { margin: 0; min-width: 0; }
.weight { text-align: right; }
.weight b { font-family: var(--f-display); font-size: 1.15rem; }
.weight small { display: block; color: var(--muted); font-size: .75rem; line-height: 1.3; }

.next { padding: 12px 18px 4px; }
.next .label { font-size: .8rem; color: var(--muted); letter-spacing: .04em; }
.cd { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; line-height: 1.2; margin-top: 2px; min-height: 2.6rem; display: flex; align-items: baseline; gap: 2px; flex-wrap: wrap; }
.cd b { font-size: 2.5rem; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.cd { align-items: baseline; gap: 4px 10px; }
.cd small { font-size: .8rem; color: var(--muted); align-self: center; }
.cd-rel { font-size: 1rem; color: var(--muted); font-weight: 700; }
.cd.due { color: var(--danger); }
.cd.due .cd-rel { color: var(--danger); }
.next-preview { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); font-size: .92rem; }
.next-preview b { font-family: var(--f-display); font-size: 1.3rem; }
.steps { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; }
.steps b { font-family: var(--f-display); }
.steps code { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; font-family: ui-monospace, monospace; }
.cd.empty { font-size: .95rem; font-weight: 500; color: var(--muted); font-family: var(--f-body); min-height: 2.6rem; align-items: center; }
.bar { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 8px; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 99px; transition: width .6s; }
.bar.due i { background: var(--danger); }
.cd-sub { color: var(--muted); font-size: .85rem; margin-top: 6px; }

.actions { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 14px 18px 14px; }
.actions.has-timer { grid-template-columns: 1fr 5.6rem; }
.actions .milk { background: var(--c); color: var(--surface); border: none; border-radius: 14px; min-height: 56px; font-family: var(--f-display); font-size: 1.1rem; font-weight: 700; }
.actions .timer { border-radius: 14px; min-height: 56px; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); background: var(--cs); color: var(--c); font-weight: 700; font-size: .78rem; line-height: 1.3; }
.actions .subs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.actions .sub { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; min-height: 48px; font-weight: 700; }
.actions .sub:hover, .actions .milk:hover, .actions .timer:hover { filter: brightness(1.05); }

.today { margin-top: auto; padding: 10px 18px 12px; border-top: 1px solid var(--line); font-size: .84rem; color: var(--muted); }
.today .lbl { font-weight: 700; color: var(--ink); margin-right: 6px; }
.today b { color: var(--ink); font-family: var(--f-display); font-size: 1rem; }

/* sections */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; margin-bottom: 8px; }
.panel h2 { margin: 0; font-family: var(--f-display); font-size: 1.15rem; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.seg button { border: none; background: transparent; border-radius: 9px; min-height: 36px; padding: 0 12px; font-size: .88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.day { margin-top: 10px; }
.day-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 8px 0 6px; border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 1; }
.day-head h3 { margin: 0; font-family: var(--f-display); font-size: 1rem; }
.day-head .sum { font-size: .78rem; color: var(--muted); }
.day-head .sum em { font-style: normal; font-weight: 700; }
.day-head .sum em.ane { color: var(--ane); }
.day-head .sum em.imouto { color: var(--imo); }
.items { list-style: none; margin: 0; padding: 0; }
.item { width: 100%; display: grid; grid-template-columns: 3.4rem 2.6rem 4.6rem 1fr auto; align-items: center; gap: 8px; text-align: left; border: none; border-bottom: 1px solid var(--line); background: transparent; padding: 9px 2px; min-height: 46px; }
.item:hover { background: var(--surface-2); }
.item .t { font-weight: 700; }
.chip { display: inline-block; text-align: center; border-radius: 99px; font-size: .78rem; font-weight: 700; padding: 1px 0; }
.chip.ane { background: var(--ane-soft); color: var(--ane); }
.chip.imouto { background: var(--imo-soft); color: var(--imo); }
.item .k { font-size: .85rem; color: var(--muted); }
.item .d { min-width: 0; overflow-wrap: anywhere; }
.item .d small { color: var(--muted); margin-left: 6px; }
.pale-flag { color: var(--danger); font-weight: 700; }
.empty-note { color: var(--muted); padding: 18px 0 6px; }
.more { margin-top: 12px; }

.chart-wrap { overflow-x: auto; }
.chart-wrap svg { display: block; width: 100%; min-width: 480px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--muted); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

.legend { margin-bottom: 4px; }
.w-btn { border: none; border-radius: 12px; min-height: 44px; padding: 0 14px; font-weight: 700; color: var(--surface); }
.w-btn.ane { background: var(--ane); }
.w-btn.imouto { background: var(--imo); }
.wtables { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px 20px; margin-top: 12px; }
.wtable { min-width: 0; }
.wtable h3 { margin: 0 0 4px; font-family: var(--f-display); font-size: .95rem; }
.wtable h3.ane { color: var(--ane); }
.wtable h3.imouto { color: var(--imo); }
.wrow { width: 100%; display: grid; grid-template-columns: 1fr 4.6rem 4rem 4.6rem; gap: 6px; align-items: center; text-align: right; border: none; border-bottom: 1px solid var(--line); background: transparent; padding: 8px 2px; min-height: 42px; font-size: .88rem; }
.wrow:hover { background: var(--surface-2); }
.wrow > :first-child { text-align: left; color: var(--muted); }
.wrow.head { font-size: .72rem; color: var(--muted); letter-spacing: .04em; min-height: 0; padding-block: 4px; }
.wrow .up { color: var(--imo); font-weight: 700; }
.wrow .down { color: var(--danger); font-weight: 700; }
.foot { color: var(--muted); font-size: .8rem; text-align: center; }
.foot p { margin: 2px 0; }

/* sheet (record form) */
.overlay { position: fixed; inset: 0; background: var(--scrim); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; border-radius: 20px 20px 0 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 640px) { .overlay { align-items: center; } .sheet { border-radius: 20px; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-size: 1.25rem; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-size: .8rem; color: var(--muted); font-weight: 700; letter-spacing: .04em; }
.field input[type="text"], .field input[type="number"], .field input[type="datetime-local"], .field select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; min-height: 46px; padding: 0 12px; width: 100%; min-width: 0; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stepper { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: center; }
.stepper input { text-align: center; font-family: var(--f-display); font-size: 1.5rem !important; font-weight: 700; }
.stepper button { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; min-height: 36px; padding: 0 14px; font-size: .88rem; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.who button[data-baby="ane"][aria-pressed="true"] { background: var(--ane); border-color: var(--ane); color: var(--surface); }
.who button[data-baby="imouto"][aria-pressed="true"] { background: var(--imo); border-color: var(--imo); color: var(--surface); }
.hint { font-size: .82rem; color: var(--muted); margin: 0; }
.caution { font-size: .85rem; background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 8px 12px; margin: 0; }
.check { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.check input { width: 20px; height: 20px; }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
.sheet-actions .spacer { flex: 1; }
.sheet-actions .btn.solid { min-width: 120px; }
.settings-baby { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.settings-baby h3 { grid-column: 1 / -1; margin: 0; font-family: var(--f-display); font-size: 1rem; }
.settings-baby .field.wide { grid-column: 1 / -1; }

/* alarm ringing */
.ring { position: fixed; inset: 0; z-index: 40; background: var(--danger); color: #fff; display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.ring-inner { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 16px; }
.ring-item { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.ring-item h2 { margin: 0; font-family: var(--f-display); font-size: 1.8rem; line-height: 1.3; }
.ring-item p { margin: 0; opacity: .92; }
.ring-item .row button { flex: 1 1 140px; min-height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,.6); background: transparent; color: #fff; font-weight: 700; }
.ring-item .row button.primary { background: #fff; color: #9B1C14; border-color: #fff; }
@media (prefers-reduced-motion: no-preference) {
  .ring { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { background: #8E1F17; } }
}

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 8px 8px 16px; border-radius: 12px; z-index: 50; font-size: .9rem; width: max-content; max-width: calc(100% - 32px); display: flex; align-items: center; gap: 12px; }
.toast span { padding-block: 4px; }
.toast-btn { flex: none; border: 1px solid color-mix(in srgb, var(--bg) 50%, transparent); background: transparent; color: var(--bg); border-radius: 10px; min-height: 40px; padding: 0 14px; font-weight: 700; }
.fix-last { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 99px; font-size: .78rem; font-weight: 700; padding: 0 12px; min-height: 34px; }
.item .fix { font-size: .72rem; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
/* feeding timetable: time | 姉 | 妹, one row per time so the twins read side by side */
.plan-head, .plan-row { display: grid; grid-template-columns: 4.4rem 1fr 1fr; gap: 8px; align-items: stretch; }
.plan-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1; background: var(--surface); padding: 10px 0 8px; border-bottom: 1px solid var(--line); }
.plan-head div { font-family: var(--f-display); font-weight: 700; }
.plan-head .ane { color: var(--ane); }
.plan-head .imouto { color: var(--imo); }
.plan-head small { display: block; font-family: var(--f-body); font-weight: 400; font-size: .74rem; color: var(--muted); }
.plan-row { padding: 5px 0; }
.plan-row .pt { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; display: flex; flex-direction: column; justify-content: center; line-height: 1.2; }
.plan-row .pt small { font-family: var(--f-body); font-weight: 700; font-size: .68rem; color: var(--warn); }
.pc { border-radius: 10px; padding: 6px 10px; min-height: 44px; display: flex; flex-direction: column; justify-content: center; font-size: .85rem; line-height: 1.35; min-width: 0; }
.pc:empty { padding: 0; }
.pc.ane:not(:empty) { --c: var(--ane); --cs: var(--ane-soft); }
.pc.imouto:not(:empty) { --c: var(--imo); --cs: var(--imo-soft); }
.pc.plan { background: var(--cs); color: var(--ink); }
.pc.next { background: var(--cs); box-shadow: inset 0 0 0 2px var(--c); }
.pc.next b { color: var(--c); }
.pc.next.due { box-shadow: inset 0 0 0 2px var(--danger); }
.pc.next.due small { color: var(--danger); font-weight: 700; }
.pc.done { border: 1px dashed var(--line); color: var(--muted); }
.pc small { color: var(--muted); font-size: .76rem; }
.row-past .pt { color: var(--muted); }
.plan-day { font-family: var(--f-display); font-weight: 700; font-size: .9rem; color: var(--muted); padding: 12px 0 4px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.plan-now { display: flex; align-items: center; gap: 8px; color: var(--danger); font-weight: 700; font-size: .8rem; margin: 6px 0; }
.plan-now::after { content: ""; flex: 1; height: 2px; background: var(--danger); border-radius: 2px; }
.settings-block { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.settings-block h3 { margin: 0; font-family: var(--f-display); font-size: 1rem; }

@media (max-width: 420px) {
  .clock { display: none; }
  .top { flex-wrap: nowrap; }
  .top h1 { font-size: 1.15rem; white-space: nowrap; }
  .top-right { gap: 6px; }
  .pill { font-size: .76rem; padding: 0 10px; }
  .icon-btn { padding: 0 10px; }
  .cd b { font-size: 2.2rem; }
  .item { grid-template-columns: 3.1rem 2.4rem 1fr auto; }
  .item .k { display: none; }
}

/* sign-in gate */
.gate { position: fixed; inset: 0; z-index: 35; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.gate-box { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 28px 22px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
.gate-box h1 { margin: 0; font-family: var(--f-display); font-size: 1.6rem; }
.gate-box p { margin: 0; color: var(--muted); }
.gate-box .twin { display: flex; justify-content: center; gap: 8px; }
.gate-box .twin i { width: 14px; height: 14px; border-radius: 50%; background: var(--ane); }
.gate-box .twin i + i { background: var(--imo); }
.gate-box .btn { min-height: 52px; }
.foot .linklike { border: none; background: transparent; color: var(--muted); text-decoration: underline; font-size: .8rem; padding: 4px 6px; min-height: 32px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</head>
<body>

<div class="app">
  <header class="top">
    <h1>ふたごミルク帳</h1>
    <div class="top-right">
      <div class="clock num" id="clock">--:--</div>
      <button class="pill" id="alarm-pill" type="button" data-act="alarm-toggle" aria-live="polite">アラーム</button>
      <button class="icon-btn" id="open-settings" type="button">設定</button>
    </div>
  </header>

  <nav class="tabs" id="tabs" aria-label="表示の切り替え">
    <button type="button" data-tab="now">いま</button>
    <button type="button" data-tab="plan">時刻表</button>
    <button type="button" data-tab="log">記録</button>
    <button type="button" data-tab="weight">体重</button>
  </nav>

  <section class="babies view" data-view="now" id="babies" aria-label="赤ちゃんごとの状況"></section>

  <section class="panel view" data-view="plan" aria-labelledby="plan-title">
    <div class="panel-head">
      <h2 id="plan-title">授乳の時刻表</h2>
    </div>
    <p class="hint">これまで12時間の授乳と、これから24時間の予定です。予定は最後の授乳から、それぞれの間隔で計算しています。</p>
    <div id="plan"></div>
  </section>

  <section class="panel view" data-view="log" aria-labelledby="tl-title">
    <div class="panel-head">
      <h2 id="tl-title">記録</h2>
      <div class="seg" id="filter" role="group" aria-label="表示する子">
        <button type="button" data-filter="all" aria-pressed="true">ふたり</button>
        <button type="button" data-filter="ane" aria-pressed="false" data-name="ane">姉</button>
        <button type="button" data-filter="imouto" aria-pressed="false" data-name="imouto">妹</button>
      </div>
    </div>
    <div id="timeline"></div>
  </section>

  <section class="panel view" data-view="weight" aria-labelledby="w-title">
    <div class="panel-head">
      <h2 id="w-title">体重の推移</h2>
      <div class="row" id="w-add"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="chart-wrap" id="chart"></div>
    <div class="wtables" id="wtable"></div>
  </section>

  <footer class="foot">
    <p id="mode-note">読み込み中…</p>
    <p id="account" hidden></p>
  </footer>
</div>

<div id="gate-root"></div>
<div id="sheet-root"></div>
<div id="ring-root"></div>
<div id="toast-root"></div>

<script>
(() => {
  const BABY_IDS = ['ane', 'imouto'];
  const DEFAULTS = {
    ane:    { name: '姉', intervalH: 4, minMl: 80, maxMl: 80 },
    imouto: { name: '妹', intervalH: 3, minMl: 40, maxMl: 50 },
  };
  const KIND = { formula: 'ミルク', expressed: '搾母乳', breast: '母乳' };
  const POO_COLOR = { yellow: '黄色', green: '緑', brown: '茶色', pale: '白っぽい' };
  const POO_AMT = { small: '少なめ', normal: 'ふつう', large: '多め' };
  const TYPE_LABEL = { milk: '授乳', pee: 'おしっこ', poo: 'うんち', weight: '体重' };
  const LS_DATA = 'futago-data-v1';
  const SHORTCUT_NAME = 'ミルクタイマー';
  const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const HOUR = 3600e3, MIN = 60e3, DAY = 86400e3;

  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const p2 = n => String(n).padStart(2, '0');
  const fmtT = ms => { const d = new Date(ms); return `${d.getHours()}:${p2(d.getMinutes())}`; };
  const fmtG = g => Number(g).toLocaleString('ja-JP');
  const startOfDay = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
  const toLocalInput = ms => { const d = new Date(ms); return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`; };
  const fromLocalInput = s => { const t = new Date(s).getTime(); return isNaN(t) ? null : t; };
  function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  function dayLabel(ms) {
    const d = new Date(ms), today = startOfDay(Date.now()), k = startOfDay(ms);
    const base = `${d.getMonth() + 1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
    if (k === today) return `今日 ${base}`;
    if (k === today - DAY) return `きのう ${base}`;
    return base;
  }
  function durParts(ms) {
    const m = Math.max(0, Math.floor(ms / MIN));
    return { h: Math.floor(m / 60), m: m % 60 };
  }
  function durText(ms) { const { h, m } = durParts(ms); return h ? `${h}時間${m}分` : `${m}分`; }

  // ---------- state ----------
  const S = {
    mode: 'loading', db: null,
    babies: {}, logs: [],
    dbRecent: [], dbWeights: [],
    local: lsGet(LS_DATA, { babies: {}, logs: {} }),
    filter: 'all', daysShown: 3, wShown: 8, tab: ['now', 'plan', 'log', 'weight'].includes(lsGet('futago-tab', 'now')) ? lsGet('futago-tab', 'now') : 'now',
    alarm: { pref: lsGet('futago-alarm-pref', false), active: false, lead: lsGet('futago-alarm-lead', 0), ack: lsGet('futago-alarm-ack', {}), snooze: {} },
    ringing: [],
    form: null,
  };
  const baby = id => ({ ...DEFAULTS[id], ...(S.babies[id] || {}) });

  function setLogs(list) {
    S.logs = list.filter(l => l && BABY_IDS.includes(l.baby) && TYPE_LABEL[l.type] && typeof l.at === 'number').sort((a, b) => b.at - a.at);
  }
  function fromLocal() {
    S.babies = S.local.babies || {};
    setLogs(Object.entries(S.local.logs || {}).map(([id, v]) => ({ ...v, id })));
  }
  function mergeDb() {
    const m = new Map();
    for (const l of S.dbWeights) m.set(l.id, l);
    for (const l of S.dbRecent) m.set(l.id, l);
    setLogs([...m.values()]);
  }

  // ---------- storage ----------
  // Records live in Firebase Firestore. Who may read/write is enforced by firestore.rules
  // (only the two family Google accounts); the page itself just signs in with Google.
  // Without a Firebase config the page falls back to this browser's localStorage.
  let unsubs = [];
  function stopSubs() { unsubs.forEach(u => { try { u(); } catch {} }); unsubs = []; S.dbRecent = []; S.dbWeights = []; }
  async function init() {
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg || !cfg.apiKey || !window.firebase) { S.mode = 'local'; fromLocal(); render(); return; }
    firebase.initializeApp(cfg);
    const fs = firebase.firestore();
    try { await fs.enablePersistence({ synchronizeTabs: true }); } catch {}
    S.db = fs; S.auth = firebase.auth();
    S.auth.onAuthStateChanged(u => {
      S.user = u; stopSubs(); S.logs = []; S.babies = {};
      if (!u) { S.mode = 'signin'; render(); return; }
      S.mode = 'db'; subscribe(); render();
    });
  }
  function subscribe() {
    const fs = S.db;
    const onErr = e => {
      if (e && e.code === 'permission-denied') { S.mode = 'denied'; stopSubs(); render(); }
      else toast('記録を読み込めませんでした。通信状況を確認してください。');
    };
    unsubs.push(fs.collection('babies').onSnapshot(s => {
      const b = {}; s.docs.forEach(d => { b[d.id] = d.data(); }); S.babies = b; render();
    }, onErr));
    unsubs.push(fs.collection('logs').orderBy('at', 'desc').limit(1000).onSnapshot(s => {
      S.dbRecent = s.docs.map(d => ({ ...d.data(), id: d.id })); mergeDb(); render();
    }, onErr));
    unsubs.push(fs.collection('logs').where('type', '==', 'weight').onSnapshot(s => {
      S.dbWeights = s.docs.map(d => ({ ...d.data(), id: d.id })); mergeDb(); render();
    }, onErr));
  }
  function signIn() {
    const p = new firebase.auth.GoogleAuthProvider();
    p.setCustomParameters({ prompt: 'select_account' });
    S.auth.signInWithPopup(p).catch(e => {
      if (e && (e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request')) return;
      if (e && e.code === 'auth/popup-blocked') return toast('ポップアップがブロックされました。ブラウザの設定でこのサイトのポップアップを許可してください。');
      if (e && e.code === 'auth/unauthorized-domain') return toast('このURLはまだ Firebase に登録されていません。手順書の「承認済みドメイン」を設定してください。');
      toast('ログインできませんでした（' + (e && e.code || '不明なエラー') + '）');
    });
  }
  function signOut() { S.auth && S.auth.signOut(); }

  function errMsg(e) {
    const c = e && e.code;
    if (c === 'permission-denied') return '保存できませんでした。許可された Google アカウントでログインしているか確認してください。';
    if (c === 'resource-exhausted') return '保存の上限に達しました。しばらくしてからもう一度お試しください。';
    return '保存できませんでした。もう一度お試しください。';
  }
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  // Firestore applies writes locally right away and syncs in the background (also when offline),
  // so the UI does not wait for the server; a later rejection shows up as a toast.
  const bg = p => { p.catch(e => toast(errMsg(e))); };

  // Returns the record's id (a fresh one for new records) so a save can be undone.
  async function saveLog(id, data) {
    if (S.mode === 'db') {
      const col = S.db.collection('logs'), ref = id ? col.doc(id) : col.doc();
      bg(ref.set(data));
      return ref.id;
    } else {
      const key = id || newId();
      S.local.logs[key] = data; lsSet(LS_DATA, S.local); fromLocal(); render();
      return key;
    }
  }
  async function deleteLog(id) {
    if (S.mode === 'db') bg(S.db.collection('logs').doc(id).delete());
    else { delete S.local.logs[id]; lsSet(LS_DATA, S.local); fromLocal(); render(); }
  }
  async function saveBaby(id, data) {
    if (S.mode === 'db') bg(S.db.doc('babies/' + id).set(data));
    else { S.local.babies[id] = data; lsSet(LS_DATA, S.local); fromLocal(); render(); }
  }

  function renderGate() {
    const root = $('#gate-root');
    if (S.mode === 'signin') {
      root.innerHTML = `<div class="gate"><div class="gate-box">
        <div class="twin" aria-hidden="true"><i></i><i></i></div>
        <h1>ふたごミルク帳</h1>
        <p>家族専用の記録帳です。登録した Google アカウントでログインしてください。</p>
        <button type="button" class="btn solid" data-act="signin">Google でログイン</button>
      </div></div>`;
    } else if (S.mode === 'denied') {
      root.innerHTML = `<div class="gate"><div class="gate-box">
        <h1>このアカウントでは見られません</h1>
        <p>${esc(S.user && S.user.email)} は、この記録帳を見られるアカウントに登録されていません。</p>
        <button type="button" class="btn" data-act="signout">別のアカウントでログイン</button>
      </div></div>`;
    } else root.innerHTML = '';
  }

  // ---------- derived ----------
  const lastOf = (id, type) => S.logs.find(l => l.baby === id && l.type === type);
  const weightsOf = id => S.logs.filter(l => l.baby === id && l.type === 'weight');
  function nextAt(id) { const m = lastOf(id, 'milk'); return m ? m.at + baby(id).intervalH * HOUR : null; }
  function milkText(l) {
    if (l.kind === 'breast') return `母乳 ${l.min || '?'}分`;
    return `${KIND[l.kind] || 'ミルク'} ${l.ml ?? '?'}mL`;
  }
  function dayStats(id, from, to) {
    const st = { milkN: 0, ml: 0, breastN: 0, pee: 0, poo: 0 };
    for (const l of S.logs) {
      if (l.baby !== id || l.at < from || l.at >= to) continue;
      if (l.type === 'milk') { st.milkN++; if (l.kind === 'breast') st.breastN++; else st.ml += Number(l.ml) || 0; }
      else if (l.type === 'pee') st.pee++;
      else if (l.type === 'poo') st.poo++;
    }
    return st;
  }
  function describe(l) {
    if (l.type === 'milk') return esc(milkText(l));
    if (l.type === 'pee') return 'おしっこ';
    if (l.type === 'poo') {
      const parts = [];
      if (l.color) parts.push(l.color === 'pale' ? `<span class="pale-flag">${POO_COLOR.pale}</span>` : POO_COLOR[l.color]);
      if (l.amount) parts.push(POO_AMT[l.amount]);
      return 'うんち' + (parts.length ? ' · ' + parts.join(' · ') : '');
    }
    if (l.type === 'weight') return `${fmtG(l.grams)}g`;
    return '';
  }

  // ---------- render ----------
  function render() {
    renderGate(); renderNames(); renderCards(); renderPlan(); renderTimeline(); renderChart(); renderWeights(); renderAlarmBar(); renderModeNote(); tick();
  }
  function renderNames() {
    document.querySelectorAll('#filter [data-name]').forEach(b => { b.textContent = baby(b.dataset.name).name; });
  }
  function renderModeNote() {
    const el = $('#mode-note'), acc = $('#account');
    if (S.mode === 'db') el.textContent = '記録はクラウドに保存され、登録したふたりのアカウントで共有されます。';
    else if (S.mode === 'local') el.textContent = 'Firebase が未設定のため、記録はこの端末のブラウザだけに保存されています。';
    else el.textContent = '読み込み中…';
    acc.hidden = S.mode !== 'db' || !S.user;
    if (!acc.hidden) acc.innerHTML = `${esc(S.user.email)} でログイン中 <button type="button" class="linklike" data-act="signout">ログアウト</button>`;
  }

  function renderCards() {
    const now = Date.now(), t0 = startOfDay(now);
    $('#babies').innerHTML = BABY_IDS.map(id => {
      const b = baby(id), ws = weightsOf(id), w = ws[0], prev = ws[1];
      const st = dayStats(id, t0, t0 + DAY);
      const lastPoo = lastOf(id, 'poo'), lastMilk = lastOf(id, 'milk');
      const range = b.minMl === b.maxMl ? `${b.minMl}mL` : `${b.minMl}〜${b.maxMl}mL`;
      let wHTML = '<b>—</b><small>体重未記録</small>';
      if (w) {
        const diff = prev ? w.grams - prev.grams : null;
        const d = new Date(w.at);
        wHTML = `<b class="num">${fmtG(w.grams)}g</b><small>${d.getMonth() + 1}/${d.getDate()}${diff !== null ? ` · 前回比 ${diff >= 0 ? '+' : ''}${fmtG(diff)}g` : ''}</small>`;
      }
      // Card reads top to bottom: when is the next feed → what was the last one → record → today's totals.
      return `<article class="card" data-baby="${id}">
        <div class="card-head">
          <h2>${esc(b.name)}</h2>
          <div class="weight">${wHTML}</div>
        </div>
        <div class="next">
          <div class="next-top">
            <span class="label">次の授乳</span>
            <button type="button" class="rule" data-bset="${id}" aria-label="${esc(b.name)}の授乳間隔と量を変更">${b.intervalH}時間ごと・${range}<span>変更</span></button>
          </div>
          <div class="cd" data-cd="${id}"></div>
          <div class="bar" data-bar="${id}"><i></i></div>
          <div class="last-row">
            <div class="cd-sub num" data-cdsub="${id}"></div>
            ${lastMilk ? `<button type="button" class="fix-last" data-edit="${esc(lastMilk.id)}" aria-label="前回の授乳（${fmtT(lastMilk.at)}）を修正・削除">修正</button>` : ''}
          </div>
        </div>
        <div class="actions${IS_IOS ? ' has-timer' : ''}">
          <button type="button" class="milk" data-add="milk" data-baby="${id}">授乳を記録</button>
          ${IS_IOS ? `<button type="button" class="timer" data-iostimer="${id}" aria-label="iPhone のタイマーを次のミルクまでセット">iPhone<br>タイマー</button>` : ''}
          <div class="subs">
            <button type="button" class="sub" data-add="pee" data-baby="${id}">おしっこ</button>
            <button type="button" class="sub" data-add="poo" data-baby="${id}">うんち</button>
            <button type="button" class="sub" data-add="weight" data-baby="${id}">体重</button>
          </div>
        </div>
        <div class="today num"><span class="lbl">今日</span>授乳 <b>${st.milkN}</b>回${st.ml ? ` ${st.ml}mL` : ''}${st.breastN ? `（母乳${st.breastN}回）` : ''} ・ おしっこ <b>${st.pee}</b> ・ うんち <b>${st.poo}</b>${lastPoo ? `（最後 ${durText(now - lastPoo.at)}前）` : ''}</div>
      </article>`;
    }).join('');
  }

  // Timetable: past 12h of actual feeds plus the next 24h projected from each twin's last feed,
  // merged into one time-ordered list with a column per twin.
  const PLAN_PAST = 12 * HOUR, PLAN_AHEAD = 24 * HOUR, CLOSE_GAP = 30 * MIN;
  function renderPlan() {
    const el = $('#plan');
    if (S.mode === 'loading') { el.innerHTML = '<p class="empty-note">記録を読み込んでいます…</p>'; return; }
    const now = Date.now(), items = [], missing = [];
    for (const id of BABY_IDS) {
      const b = baby(id), last = lastOf(id, 'milk');
      S.logs.forEach(l => { if (l.baby === id && l.type === 'milk' && l.at >= now - PLAN_PAST) items.push({ at: l.at, baby: id, kind: 'done', log: l }); });
      if (!last) { missing.push(id); continue; }
      const step = b.intervalH * HOUR;
      for (let t = last.at + step, k = 0; t <= now + PLAN_AHEAD; t += step, k++) items.push({ at: t, baby: id, kind: k === 0 ? 'next' : 'plan' });
    }
    if (!items.length) {
      el.innerHTML = '<p class="empty-note">「いま」タブで授乳を記録すると、ここに次からの予定がふたり並んで表示されます。</p>';
      return;
    }
    items.sort((a, b) => a.at - b.at);
    // Upcoming feeds of the two twins less than 30 minutes apart get a "続けて" flag.
    const upcoming = items.filter(i => i.kind !== 'done');
    upcoming.forEach(i => { i.close = upcoming.some(j => j.baby !== i.baby && Math.abs(j.at - i.at) < CLOSE_GAP); });
    // One row per minute; both twins share a row when their times match.
    const rows = [];
    for (const i of items) {
      const key = Math.floor(i.at / MIN), r = rows[rows.length - 1];
      if (r && r.key === key && !r[i.baby]) r[i.baby] = i;
      else rows.push({ key, at: i.at, [i.baby]: i });
    }
    const cell = (id, i) => {
      if (!i) return `<div class="pc ${id}"></div>`;
      const b = baby(id), range = b.minMl === b.maxMl ? `${b.minMl}mL` : `${b.minMl}〜${b.maxMl}mL`;
      if (i.kind === 'done') return `<div class="pc ${id} done">済 ${esc(milkText(i.log))}</div>`;
      if (i.kind === 'next') {
        const due = now >= i.at;
        return `<div class="pc ${id} next${due ? ' due' : ''}"><b>次</b> ${range}<small>${due ? `${durText(now - i.at)} すぎ` : `あと ${durText(i.at - now)}`}</small></div>`;
      }
      return `<div class="pc ${id} plan">${range}</div>`;
    };
    let html = `<div class="plan-head"><div></div>${BABY_IDS.map(id => `<div class="${id}">${esc(baby(id).name)}<small>${baby(id).intervalH}時間ごと</small></div>`).join('')}</div>`;
    let lastDay = null, nowShown = false;
    for (const r of rows) {
      const day = startOfDay(r.at);
      if (day !== lastDay) { html += `<div class="plan-day">${dayLabel(r.at)}</div>`; lastDay = day; }
      if (!nowShown && r.at > now) { html += `<div class="plan-now num">いま ${fmtT(now)}</div>`; nowShown = true; }
      const close = BABY_IDS.some(id => r[id] && r[id].close);
      html += `<div class="plan-row${r.at <= now ? ' row-past' : ''}"><div class="pt num">${fmtT(r.at)}${close ? '<small>ふたり続けて</small>' : ''}</div>${BABY_IDS.map(id => cell(id, r[id])).join('')}</div>`;
    }
    if (missing.length) html += `<p class="hint">${missing.map(id => esc(baby(id).name)).join('と')}はまだ授乳の記録がないため、予定を出せません。</p>`;
    el.innerHTML = html;
  }

  function renderTimeline() {
    const el = $('#timeline');
    if (S.mode === 'loading') { el.innerHTML = '<p class="empty-note">記録を読み込んでいます…</p>'; return; }
    const list = S.logs.filter(l => S.filter === 'all' || l.baby === S.filter);
    if (!list.length) {
      el.innerHTML = '<p class="empty-note">まだ記録がありません。「いま」タブのカードから「授乳を記録」すると、ここに並びます。</p>';
      return;
    }
    const groups = new Map();
    for (const l of list) { const k = startOfDay(l.at); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(l); }
    const keys = [...groups.keys()];
    const shown = keys.slice(0, S.daysShown);
    const ids = S.filter === 'all' ? BABY_IDS : [S.filter];
    el.innerHTML = shown.map(k => {
      const sums = ids.map(id => {
        const st = dayStats(id, k, k + DAY);
        return `<span><em class="${id}">${esc(baby(id).name)}</em> 授乳${st.milkN}回 ${st.ml}mL · 尿${st.pee} · 便${st.poo}</span>`;
      }).join('　');
      return `<div class="day"><div class="day-head"><h3>${dayLabel(k)}</h3><div class="sum num">${sums}</div></div>
        <ul class="items">${groups.get(k).map(l => `<li><button type="button" class="item" data-edit="${esc(l.id)}" aria-label="${esc(baby(l.baby).name)} ${TYPE_LABEL[l.type]} ${fmtT(l.at)} を修正">
          <span class="t num">${fmtT(l.at)}</span>
          <span class="chip ${l.baby}">${esc(baby(l.baby).name)}</span>
          <span class="k">${TYPE_LABEL[l.type]}</span>
          <span class="d">${describe(l)}${l.note ? `<small>${esc(l.note)}</small>` : ''}</span>
          <span class="fix" aria-hidden="true">修正</span>
        </button></li>`).join('')}</ul></div>`;
    }).join('') + (keys.length > S.daysShown ? `<div class="more"><button type="button" class="btn ghost" data-act="more">さらに前の日を表示（残り${keys.length - S.daysShown}日）</button></div>` : '');
  }

  function renderWeights() {
    $('#w-add').innerHTML = BABY_IDS.map(id => `<button type="button" class="w-btn ${id}" data-add="weight" data-baby="${id}">${esc(baby(id).name)}の体重を記録</button>`).join('');
    $('#wtable').innerHTML = BABY_IDS.map(id => {
      const ws = weightsOf(id);
      if (!ws.length) return `<div class="wtable"><h3 class="${id}">${esc(baby(id).name)}</h3><p class="empty-note">まだ記録がありません。</p></div>`;
      const rows = ws.slice(0, S.wShown).map((w, i) => {
        const prev = ws[i + 1], d = new Date(w.at);
        let diff = '', perDay = '';
        if (prev) {
          const g = w.grams - prev.grams, days = (w.at - prev.at) / DAY;
          const cls = g < 0 ? 'down' : 'up';
          diff = `<span class="${cls}">${g >= 0 ? '+' : ''}${fmtG(g)}g</span>`;
          if (days >= 0.5) { const pd = Math.round(g / days); perDay = `<span class="${cls}">${pd >= 0 ? '+' : ''}${pd}g/日</span>`; }
        }
        return `<button type="button" class="wrow num" data-edit="${esc(w.id)}" aria-label="${esc(baby(id).name)}の体重 ${d.getMonth() + 1}月${d.getDate()}日 ${fmtG(w.grams)}g を修正">
          <span>${d.getMonth() + 1}/${d.getDate()} ${fmtT(w.at)}${w.note ? ` <small>${esc(w.note)}</small>` : ''}</span><b>${fmtG(w.grams)}g</b><span>${diff}</span><span>${perDay}</span></button>`;
      }).join('');
      return `<div class="wtable"><h3 class="${id}">${esc(baby(id).name)}</h3>
        <div class="wrow head" aria-hidden="true"><span>日時</span><span>体重</span><span>前回比</span><span>1日あたり</span></div>${rows}
        ${ws.length > S.wShown ? `<button type="button" class="btn ghost more" data-act="wmore">さらに表示（残り${ws.length - S.wShown}件）</button>` : ''}</div>`;
    }).join('');
  }

  function renderChart() {
    const series = BABY_IDS.map(id => ({ id, pts: weightsOf(id).map(l => ({ t: l.at, g: Number(l.grams) })).filter(p => p.g > 0).sort((a, b) => a.t - b.t) }));
    $('#legend').innerHTML = BABY_IDS.map(id => `<span><i style="background:var(--${id === 'ane' ? 'ane' : 'imo'})"></i>${esc(baby(id).name)}</span>`).join('');
    const all = series.flatMap(s => s.pts);
    if (!all.length) { $('#chart').innerHTML = '<p class="empty-note">体重を記録するとここにグラフが表示されます。</p>'; return; }
    const W = 640, H = 260, pl = 58, pr = 92, pt = 16, pb = 34;
    let t0 = Math.min(...all.map(p => p.t)), t1 = Math.max(...all.map(p => p.t));
    if (t1 - t0 < 3 * DAY) { const mid = (t0 + t1) / 2; t0 = mid - 1.5 * DAY; t1 = mid + 1.5 * DAY; }
    else { const pad = (t1 - t0) * 0.04; t0 -= pad; t1 += pad; }
    const gs = all.map(p => p.g);
    let g0 = Math.floor((Math.min(...gs) - 100) / 100) * 100, g1 = Math.ceil((Math.max(...gs) + 100) / 100) * 100;
    const span = g1 - g0, step = span <= 600 ? 100 : span <= 1200 ? 200 : span <= 3000 ? 500 : 1000;
    g0 = Math.floor(g0 / step) * step; g1 = Math.ceil(g1 / step) * step;
    const x = t => pl + (t - t0) / (t1 - t0) * (W - pl - pr);
    const y = g => pt + (1 - (g - g0) / (g1 - g0)) * (H - pt - pb);
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="体重の推移グラフ">`;
    for (let g = g0; g <= g1; g += step) {
      svg += `<line x1="${pl}" x2="${W - pr}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/>`;
      svg += `<text x="${pl - 8}" y="${y(g) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" class="num">${fmtG(g)}g</text>`;
    }
    const days = Math.max(1, Math.round((t1 - t0) / DAY));
    const every = Math.max(1, Math.ceil(days / 6));
    let d = startOfDay(t0) + DAY, i = 0;
    for (; d <= t1; d += DAY, i++) {
      if (i % every) continue;
      const dd = new Date(d);
      svg += `<line x1="${x(d)}" x2="${x(d)}" y1="${H - pb}" y2="${H - pb + 4}" stroke="var(--muted)"/>`;
      svg += `<text x="${x(d)}" y="${H - pb + 18}" text-anchor="middle" font-size="11" fill="var(--muted)">${dd.getMonth() + 1}/${dd.getDate()}</text>`;
    }
    svg += `<line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="var(--muted)" stroke-width="1"/>`;
    const ends = [];
    for (const s of series) {
      if (!s.pts.length) continue;
      const col = `var(--${s.id === 'ane' ? 'ane' : 'imo'})`;
      if (s.pts.length > 1) svg += `<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${s.pts.map(p => `${x(p.t).toFixed(1)},${y(p.g).toFixed(1)}`).join(' ')}"/>`;
      s.pts.forEach((p, k) => {
        const last = k === s.pts.length - 1;
        svg += `<circle cx="${x(p.t)}" cy="${y(p.g)}" r="${last ? 5 : 3.5}" fill="${last ? col : 'var(--surface)'}" stroke="${col}" stroke-width="2"><title>${fmtG(p.g)}g</title></circle>`;
      });
      const lp = s.pts[s.pts.length - 1];
      ends.push({ id: s.id, col, x: x(lp.t), y: y(lp.g), g: lp.g });
    }
    if (ends.length === 2 && Math.abs(ends[0].y - ends[1].y) < 30) {
      const [a, b] = ends[0].y <= ends[1].y ? [ends[0], ends[1]] : [ends[1], ends[0]];
      const mid = (a.y + b.y) / 2; a.ly = mid - 15; b.ly = mid + 15;
    }
    for (const e of ends) {
      const ly = e.ly ?? e.y;
      svg += `<text x="${e.x + 10}" y="${ly - 2}" font-size="12" font-weight="700" fill="${e.col}">${esc(baby(e.id).name)}</text>`;
      svg += `<text x="${e.x + 10}" y="${ly + 13}" font-size="12" fill="var(--ink)" class="num">${fmtG(e.g)}g</text>`;
    }
    svg += '</svg>';
    $('#chart').innerHTML = svg;
  }

  // ---------- alarm state (header pill + the block in 設定) ----------
  let wakeLock = null;
  function alarmBlockHTML() {
    const leadTxt = S.alarm.lead ? `予定の${S.alarm.lead}分前` : '予定時刻';
    const state = S.alarm.active
      ? `オン：${leadTxt}に音とバイブでお知らせします。画面のスリープ防止は${wakeLock ? 'オン' : 'この端末では使えません'}。`
      : 'オフです。オンにすると、次の授乳時刻に音とバイブでお知らせします。';
    return `<h3>アラーム（この端末）</h3>
      <p class="hint">${state}アラームはこの画面を開いている間だけ鳴ります。夜間は iPhone のタイマーも併用してください。</p>
      <div class="row"><button type="button" class="btn" data-act="test">音を試す</button>${S.alarm.active
        ? '<button type="button" class="btn ghost" data-act="alarm-off">オフにする</button>'
        : '<button type="button" class="btn solid" data-act="alarm-on">オンにする</button>'}</div>`;
  }
  function renderAlarmBar() {
    const el = $('#alarm-pill');
    el.className = 'pill' + (S.alarm.active ? ' on' : '');
    el.textContent = S.alarm.active ? 'アラーム オン' : 'アラーム オフ';
    const blk = $('#alarm-block'); if (blk) blk.innerHTML = alarmBlockHTML();
  }

  // ---------- sound ----------
  let actx = null;
  function ensureAudio() {
    try {
      if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
      if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    } catch {}
    return actx;
  }
  function chime() {
    const c = ensureAudio(); if (!c) return;
    const t = c.currentTime;
    [[0, 880], [0.2, 1175], [0.4, 1568], [0.9, 880], [1.1, 1175], [1.3, 1568]].forEach(([dt, f]) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + dt);
      g.gain.exponentialRampToValueAtTime(0.5, t + dt + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.45);
      o.connect(g); g.connect(c.destination);
      o.start(t + dt); o.stop(t + dt + 0.5);
    });
  }
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; renderAlarmBar(); });
      }
    } catch { wakeLock = null; }
    renderAlarmBar();
  }
  function alarmOn(withTest) {
    ensureAudio();
    if (withTest) chime();
    S.alarm.active = true; S.alarm.pref = true; lsSet('futago-alarm-pref', true);
    // Treat already-overdue feeds at the moment of turning on as acknowledged only if user tests; otherwise ring.
    requestWakeLock();
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {}); } catch {}
    renderAlarmBar(); tick();
  }
  function alarmOff() {
    S.alarm.active = false; S.alarm.pref = false; lsSet('futago-alarm-pref', false);
    try { wakeLock && wakeLock.release(); } catch {}
    wakeLock = null; S.ringing = []; renderRing(); renderAlarmBar();
  }
  // Sound needs a tap after each page load, so the first tap anywhere resumes an alarm that was on.
  document.addEventListener('pointerdown', () => {
    if (S.alarm.pref && !S.alarm.active) alarmOn(false);
  }, { capture: true });

  // ---------- tabs ----------
  function applyTab() {
    document.querySelectorAll('.view').forEach(v => { v.hidden = v.dataset.view !== S.tab; });
    document.querySelectorAll('#tabs button').forEach(b => {
      if (b.dataset.tab === S.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (S.alarm.active && !wakeLock) requestWakeLock(); tick(); }
  });

  // ---------- ringing ----------
  let ringTimer = null;
  function checkAlarms(now) {
    const want = [];
    if (S.alarm.active) {
      for (const id of BABY_IDS) {
        const n = nextAt(id); if (!n) continue;
        if (now >= n - S.alarm.lead * MIN && S.alarm.ack[id] !== n && now >= (S.alarm.snooze[id] || 0)) want.push(id);
      }
    }
    const fresh = want.filter(id => !S.ringing.includes(id));
    const changed = fresh.length || want.length !== S.ringing.length;
    S.ringing = want;
    if (fresh.length) notify(fresh);
    if (changed) renderRing();
  }
  function notify(ids) {
    const names = ids.map(id => baby(id).name).join('と');
    try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch {}
    try { if ('Notification' in window && Notification.permission === 'granted') new Notification('ミルクの時間です', { body: `${names}の授乳時刻になりました`, tag: 'futago-' + ids.join('-') }); } catch {}
  }
  function renderRing() {
    const root = $('#ring-root');
    if (!S.ringing.length) {
      root.innerHTML = ''; if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
      document.title = 'ふたごミルク帳'; return;
    }
    document.title = '【ミルクの時間】ふたごミルク帳';
    if (!ringTimer) { chime(); ringTimer = setInterval(() => { chime(); try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {} }, 3000); }
    const now = Date.now();
    root.innerHTML = `<div class="ring" role="alertdialog" aria-label="授乳アラーム"><div class="ring-inner">${S.ringing.map(id => {
      const b = baby(id), n = nextAt(id), m = lastOf(id, 'milk');
      const when = now >= n ? `予定 ${fmtT(n)}（${durText(now - n)}経過）` : `予定 ${fmtT(n)}（あと${durText(n - now)}）`;
      return `<div class="ring-item"><h2>${esc(b.name)}のミルクの時間です</h2>
        <p class="num">${when}<br>前回 ${fmtT(m.at)} ${esc(milkText(m))}</p>
        <div class="row">
          <button type="button" class="primary" data-ring="record" data-baby="${id}">授乳を記録する</button>
          <button type="button" data-ring="snooze" data-baby="${id}">5分後にもう一度</button>
          <button type="button" data-ring="stop" data-baby="${id}">止める</button>
        </div></div>`;
    }).join('')}</div></div>`;
  }
  function ack(id) { S.alarm.ack[id] = nextAt(id); lsSet('futago-alarm-ack', S.alarm.ack); }

  // ---------- tick ----------
  let planMinute = 0;
  function tick() {
    const now = Date.now();
    $('#clock').textContent = fmtT(now);
    // The timetable's "あと…" and the いま line move once a minute.
    if (S.tab === 'plan' && Math.floor(now / MIN) !== planMinute) { planMinute = Math.floor(now / MIN); renderPlan(); }
    for (const id of BABY_IDS) {
      const cd = document.querySelector(`[data-cd="${id}"]`); if (!cd) continue;
      const bar = document.querySelector(`[data-bar="${id}"]`), sub = document.querySelector(`[data-cdsub="${id}"]`);
      const m = lastOf(id, 'milk'), b = baby(id);
      if (!m) {
        cd.className = 'cd empty'; cd.textContent = S.mode === 'loading' ? '読み込み中…' : '最初の授乳を記録すると、ここに次の時間が出ます';
        bar.className = 'bar'; bar.firstElementChild.style.width = '0'; sub.textContent = ''; continue;
      }
      const n = m.at + b.intervalH * HOUR, frac = Math.min(1, (now - m.at) / (b.intervalH * HOUR));
      const dayTag = startOfDay(n) > startOfDay(now) ? '<small>翌日</small>' : '';
      if (now < n) { cd.className = 'cd'; cd.innerHTML = `${dayTag}<b>${fmtT(n)}</b><span class="cd-rel">あと ${durText(n - now)}</span>`; bar.className = 'bar'; }
      else { cd.className = 'cd due'; cd.innerHTML = `<b>${fmtT(n)}</b><span class="cd-rel">予定から ${durText(now - n)} すぎています</span>`; bar.className = 'bar due'; }
      bar.firstElementChild.style.width = (Math.max(0, frac) * 100).toFixed(1) + '%';
      sub.textContent = `前回 ${fmtT(m.at)}・${milkText(m)}（${durText(now - m.at)}前）`;
    }
    checkAlarms(now);
  }
  setInterval(tick, 1000);

  // ---------- form ----------
  function openForm(type, babyId, log) {
    const b = baby(babyId);
    if (log) {
      S.form = { ...log, editing: log.id };
    } else {
      S.form = { type, baby: babyId, at: Date.now(), note: '' };
      if (type === 'milk') {
        const last = lastOf(babyId, 'milk');
        S.form.kind = last && last.kind ? last.kind : 'formula';
        S.form.ml = last && last.kind !== 'breast' && last.ml ? last.ml : b.maxMl;
        S.form.min = last && last.min ? last.min : 10;
      }
      if (type === 'poo') { S.form.color = 'yellow'; S.form.amount = 'normal'; S.form.withPee = true; }
      if (type === 'weight') { const w = weightsOf(babyId)[0]; S.form.grams = w ? w.grams : ''; }
    }
    S.form.confirmDelete = false;
    renderForm();
  }
  function readForm() {
    const F = S.form; if (!F) return;
    const v = id => { const el = document.getElementById(id); return el ? el.value : undefined; };
    if (v('f-at') !== undefined) { const t = fromLocalInput(v('f-at')); if (t) F.at = t; }
    if (v('f-ml') !== undefined) F.ml = v('f-ml') === '' ? '' : Number(v('f-ml'));
    if (v('f-min') !== undefined) F.min = v('f-min') === '' ? '' : Number(v('f-min'));
    if (v('f-g') !== undefined) F.grams = v('f-g') === '' ? '' : Number(v('f-g'));
    if (v('f-note') !== undefined) F.note = v('f-note');
    const wp = document.getElementById('f-withpee'); if (wp) F.withPee = wp.checked;
  }
  function chipsHTML(attr, options, current) {
    return `<div class="chips" role="group">${Object.entries(options).map(([k, label]) => `<button type="button" data-${attr}="${k}" aria-pressed="${String(current) === String(k)}">${esc(label)}</button>`).join('')}</div>`;
  }
  function renderForm() {
    const root = $('#sheet-root'), F = S.form;
    if (!F) { root.innerHTML = ''; return; }
    if (F.type === 'settings') return renderSettings();
    if (F.type === 'shortcut') return renderShortcutHelp();
    const b = baby(F.baby);
    let body = '';
    if (F.type === 'milk') {
      const presets = new Set();
      for (let ml = b.minMl - 10; ml <= b.maxMl + 10; ml += 10) if (ml > 0) presets.add(ml);
      body += `<div class="field"><span class="lbl">種類</span>${chipsHTML('kind', KIND, F.kind)}</div>`;
      if (F.kind === 'breast') {
        body += `<div class="field"><label for="f-min">授乳した時間（分）</label>
          <div class="stepper"><button type="button" data-step="min:-5">−5</button><input type="number" inputmode="numeric" id="f-min" min="1" max="90" value="${esc(F.min)}"><button type="button" data-step="min:5">+5</button></div></div>`;
      } else {
        body += `<div class="field"><label for="f-ml">量（mL）</label>
          <div class="stepper"><button type="button" data-step="ml:-10">−10</button><input type="number" inputmode="numeric" id="f-ml" min="1" max="300" value="${esc(F.ml)}"><button type="button" data-step="ml:10">+10</button></div>
          <div class="chips">${[...presets].map(ml => `<button type="button" data-ml="${ml}" aria-pressed="${Number(F.ml) === ml}">${ml}mL</button>`).join('')}</div>
          <p class="hint">${esc(b.name)}の目安：${b.minMl === b.maxMl ? b.minMl : `${b.minMl}〜${b.maxMl}`}mL・${b.intervalH}時間ごと</p></div>`;
      }
    } else if (F.type === 'poo') {
      body += `<div class="field"><span class="lbl">色</span>${chipsHTML('color', POO_COLOR, F.color)}
        ${F.color === 'pale' ? '<p class="caution">白っぽい・クリーム色の便は、母子手帳の便色カードと見比べてください。近い色が続くときは早めに小児科へ相談を。</p>' : ''}</div>
        <div class="field"><span class="lbl">量</span>${chipsHTML('amount', POO_AMT, F.amount)}</div>`;
      if (!F.editing) body += `<label class="check"><input type="checkbox" id="f-withpee" ${F.withPee ? 'checked' : ''}> おしっこも一緒に記録する</label>`;
    } else if (F.type === 'weight') {
      const w = weightsOf(F.baby).find(l => l.id !== F.editing);
      body += `<div class="field"><label for="f-g">体重（g）</label>
        <div class="stepper"><button type="button" data-step="grams:-10">−10</button><input type="number" inputmode="numeric" id="f-g" min="500" max="15000" value="${esc(F.grams)}"><button type="button" data-step="grams:10">+10</button></div>
        ${w ? `<p class="hint">前回：${fmtG(w.grams)}g（${new Date(w.at).getMonth() + 1}/${new Date(w.at).getDate()}）</p>` : ''}</div>`;
    }
    const title = (F.editing ? '修正：' : '') + TYPE_LABEL[F.type];
    root.innerHTML = `<div class="overlay" data-act="close-bg"><form class="sheet" id="sheet" novalidate>
      <div class="sheet-head"><h2>${title}</h2><button type="button" class="icon-btn" data-act="close">閉じる</button></div>
      <div class="field"><span class="lbl">だれ</span><div class="chips who" role="group">${BABY_IDS.map(id => `<button type="button" data-who="${id}" data-baby="${id}" aria-pressed="${F.baby === id}">${esc(baby(id).name)}</button>`).join('')}</div></div>
      ${body}
      <div class="field"><label for="f-at">時刻</label><input type="datetime-local" id="f-at" value="${toLocalInput(F.at)}">
        <div class="chips"><button type="button" data-ago="0">今</button><button type="button" data-ago="5">5分前</button><button type="button" data-ago="15">15分前</button><button type="button" data-ago="30">30分前</button><button type="button" data-ago="60">1時間前</button></div></div>
      ${F.type === 'milk' ? `<p class="next-preview num" id="f-next" aria-live="polite">${nextPreview()}</p>` : ''}
      <div class="field"><label for="f-note">メモ（任意）</label><input type="text" id="f-note" maxlength="200" value="${esc(F.note)}" placeholder="吐き戻し、飲みムラなど"></div>
      <div class="sheet-actions">
        ${F.editing ? (F.confirmDelete ? '<button type="button" class="btn danger" data-act="delete-yes">本当に削除する</button><button type="button" class="btn ghost" data-act="delete-no">やめる</button>' : '<button type="button" class="btn danger" data-act="delete">削除</button>') : ''}
        <span class="spacer"></span>
        <button type="button" class="btn ghost" data-act="close">キャンセル</button>
        <button type="submit" class="btn solid" id="f-save">保存</button>
      </div>
    </form></div>`;
  }

  function nextPreview() {
    const F = S.form, b = baby(F.baby), n = F.at + b.intervalH * HOUR;
    const tag = startOfDay(n) > startOfDay(F.at) ? '翌日 ' : '';
    return `次の授乳は ${tag}<b>${fmtT(n)}</b>（${b.intervalH}時間後）。アラームがオンならこの時刻に鳴ります。`;
  }
  document.addEventListener('input', e => {
    if (e.target.id !== 'f-at' || !S.form || S.form.type !== 'milk') return;
    const t = fromLocalInput(e.target.value); if (!t) return;
    S.form.at = t; const el = $('#f-next'); if (el) el.innerHTML = nextPreview();
  });

  async function submitForm() {
    readForm();
    const F = S.form; if (!F) return;
    const now = Date.now();
    if (!F.at || F.at > now + 5 * MIN) return toast('時刻を確認してください（未来の時刻は記録できません）。');
    const data = { baby: F.baby, type: F.type, at: F.at, note: (F.note || '').trim(), updatedAt: now };
    if (F.type === 'milk') {
      data.kind = F.kind;
      if (F.kind === 'breast') { if (!(F.min >= 1 && F.min <= 90)) return toast('授乳時間は1〜90分で入力してください。'); data.min = F.min; }
      else { if (!(F.ml >= 1 && F.ml <= 300)) return toast('量は1〜300mLで入力してください。'); data.ml = F.ml; }
    } else if (F.type === 'poo') {
      data.color = F.color; data.amount = F.amount;
    } else if (F.type === 'weight') {
      if (!(F.grams >= 500 && F.grams <= 15000)) return toast('体重は500〜15,000gで入力してください。');
      data.grams = F.grams;
    }
    const prevLast = lastOf(F.baby, 'milk');
    const isLatestMilk = F.type === 'milk' && (!prevLast || prevLast.id === F.editing || F.at >= prevLast.at);
    const editingId = F.editing || null;
    const before = editingId ? S.logs.find(l => l.id === editingId) : null;
    const btn = $('#f-save'); if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
    try {
      const savedIds = [await saveLog(editingId, data)];
      if (F.type === 'poo' && !editingId && F.withPee) savedIds.push(await saveLog(null, { baby: F.baby, type: 'pee', at: F.at, note: '', updatedAt: now }));
      if (F.type === 'milk') S.ringing = S.ringing.filter(id => id !== F.baby);
      if (isLatestMilk && IS_IOS && lsGet('futago-ios-auto', false) && lsGet('futago-shortcut-ready', false)) {
        startIphoneTimer(data.at + baby(data.baby).intervalH * HOUR);
      }
      S.form = null; renderForm();
      const nb = baby(data.baby);
      // "取り消す" puts things back: a new record is deleted, an edited one gets its old values.
      const undo = editingId
        ? () => { if (!before) return; const { id: _drop, ...prev } = before; saveLog(editingId, prev).then(() => toast('修正を取り消しました')); }
        : () => { savedIds.forEach(id => deleteLog(id)); toast('記録を取り消しました'); };
      const verb = editingId ? '修正しました' : '記録しました';
      toast(isLatestMilk
        ? `${nb.name}の授乳を${verb}。次は ${fmtT(data.at + nb.intervalH * HOUR)} です`
        : `${nb.name}の${TYPE_LABEL[data.type]}を${verb}`, { label: '取り消す', fn: undo });
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = '保存'; }
      toast(errMsg(e));
    }
  }

  // ---------- settings ----------
  const INTERVAL_CHOICES = [2, 2.5, 3, 3.5, 4, 4.5, 5];
  function openSettings(only) {
    S.form = { type: 'settings', only: only || null };
    renderSettings();
  }
  function renderSettings() {
    const only = S.form.only, ids = only ? [only] : BABY_IDS;
    $('#sheet-root').innerHTML = `<div class="overlay" data-act="close-bg"><form class="sheet" id="sheet" novalidate>
      <div class="sheet-head"><h2>${only ? `${esc(baby(only).name)}の授乳間隔と量` : '設定'}</h2><button type="button" class="icon-btn" data-act="close">閉じる</button></div>
      ${only ? '' : `<div class="settings-block" id="alarm-block">${alarmBlockHTML()}</div>
        <div class="settings-block">
          <div class="field"><label for="s-lead">アラームを鳴らすタイミング（この端末）</label>
            <select id="s-lead">${[0, 5, 10, 15, 30].map(m => `<option value="${m}" ${S.alarm.lead === m ? 'selected' : ''}>${m ? `予定の${m}分前` : '予定時刻ちょうど'}</option>`).join('')}</select></div>
          ${IS_IOS ? `<div class="field"><span class="lbl">iPhone のタイマー（この端末）</span>
            <label class="check"><input type="checkbox" id="s-iosauto" ${lsGet('futago-ios-auto', false) ? 'checked' : ''}> 授乳を記録したら、iPhone のタイマーも自動でセットする</label>
            <button type="button" class="btn ghost" data-act="shortcut-help">ショートカットの作り方を見る</button></div>` : ''}
        </div>`}
      ${ids.map(id => { const b = baby(id); return `<div class="settings-baby">
        <h3>${id === 'ane' ? '姉' : '妹'}</h3>
        <div class="field wide"><label for="s-${id}-name">呼び名</label><input type="text" id="s-${id}-name" maxlength="12" value="${esc(b.name)}"></div>
        <div class="field wide"><label for="s-${id}-int">授乳の間隔（何時間ごと）</label>
          <div class="chips" role="group">${INTERVAL_CHOICES.map(h => `<button type="button" data-int="${id}:${h}" aria-pressed="${b.intervalH === h}">${h}時間</button>`).join('')}</div>
          <input type="number" inputmode="decimal" step="0.25" min="1" max="8" id="s-${id}-int" value="${b.intervalH}">
          <p class="hint">次の授乳時刻とアラームは、最後の授乳からこの間隔で計算します。15分単位（例：2.75）でも入力できます。</p></div>
        <div class="field"><label for="s-${id}-min">量の目安 下限（mL）</label><input type="number" inputmode="numeric" min="5" max="300" id="s-${id}-min" value="${b.minMl}"></div>
        <div class="field"><label for="s-${id}-max">上限（mL）</label><input type="number" inputmode="numeric" min="5" max="300" id="s-${id}-max" value="${b.maxMl}"></div>
      </div>`; }).join('')}
      <p class="hint">間隔や量の目安は、医師・助産師の指示に合わせて変更してください。</p>
      <div class="sheet-actions"><span class="spacer"></span><button type="button" class="btn ghost" data-act="close">キャンセル</button><button type="submit" class="btn solid" id="f-save">保存</button></div>
    </form></div>`;
  }
  async function submitSettings() {
    if ($('#s-lead')) { const lead = Number($('#s-lead').value) || 0; S.alarm.lead = lead; lsSet('futago-alarm-lead', lead); }
    if ($('#s-iosauto')) lsSet('futago-ios-auto', $('#s-iosauto').checked);
    try {
      for (const id of (S.form.only ? [S.form.only] : BABY_IDS)) {
        const name = $(`#s-${id}-name`).value.trim() || DEFAULTS[id].name;
        const intervalH = Number($(`#s-${id}-int`).value);
        let minMl = Number($(`#s-${id}-min`).value), maxMl = Number($(`#s-${id}-max`).value);
        if (!(intervalH >= 1 && intervalH <= 8)) return toast('授乳の間隔は1〜8時間で入力してください。');
        if (!(minMl >= 5 && maxMl >= 5 && minMl <= 300 && maxMl <= 300)) return toast('量の目安は5〜300mLで入力してください。');
        if (minMl > maxMl) [minMl, maxMl] = [maxMl, minMl];
        const next = { name, intervalH, minMl, maxMl };
        const cur = baby(id);
        if (cur.name !== name || cur.intervalH !== intervalH || cur.minMl !== minMl || cur.maxMl !== maxMl) await saveBaby(id, next);
      }
      S.form = null; renderForm(); render(); toast('設定を保存しました');
    } catch (e) { toast(errMsg(e)); }
  }

  // ---------- iPhone timer (via the Shortcuts app) ----------
  // A web page cannot drive the Clock app, so it runs a user-made shortcut named
  // SHORTCUT_NAME and hands it the minutes until the next feed; the shortcut's single
  // "タイマーを開始" action starts the timer with that many minutes.
  function startIphoneTimer(at) {
    const min = Math.ceil((at - Date.now()) / MIN);
    if (min <= 0) return toast('次のミルクの時刻はもう過ぎています。');
    location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(SHORTCUT_NAME)}&input=text&text=${min}`;
  }
  function setIphoneTimer(id) {
    const n = nextAt(id);
    if (!n) return toast('先に授乳を記録してください。次のミルクまでの時間でタイマーをセットします。');
    if (!lsGet('futago-shortcut-ready', false)) return openShortcutHelp(id);
    startIphoneTimer(n);
  }
  function openShortcutHelp(id) {
    S.form = { type: 'shortcut', baby: id };
    renderShortcutHelp();
  }
  function renderShortcutHelp() {
    const id = S.form.baby;
    $('#sheet-root').innerHTML = `<div class="overlay" data-act="close-bg"><div class="sheet" role="dialog" aria-label="iPhone のタイマー連携">
      <div class="sheet-head"><h2>iPhone のタイマー連携</h2><button type="button" class="icon-btn" data-act="close">閉じる</button></div>
      <p class="hint">最初に1回だけ、iPhone の「ショートカット」アプリでタイマー用のショートカットを作ります（2分ほど）。</p>
      <ol class="steps">
        <li>「ショートカット」アプリを開き、右上の <b>＋</b> で新しいショートカットを作ります。</li>
        <li>名前を <code>${SHORTCUT_NAME}</code> にします（一字一句このとおりに）。</li>
        <li>「アクションを追加」で <b>タイマー</b> と検索し、<b>「タイマーを開始」</b>を追加します。</li>
        <li>「30 分」の数字の部分をタップし、変数の <b>「ショートカットの入力」</b> を選びます。単位は <b>分</b> のままにします。</li>
        <li>右上の「完了」で保存します。</li>
      </ol>
      <p class="hint">初回は「"ショートカット"で開きますか？」などの確認が出るので、「開く」「許可」を選んでください。ショートカットはご夫婦それぞれの iPhone で作る必要があります。</p>
      <div class="sheet-actions"><span class="spacer"></span>
        <button type="button" class="btn ghost" data-act="close">あとで</button>
        <button type="button" class="btn solid" data-act="shortcut-ready">${id ? '作った・タイマーをセット' : '作った'}</button>
      </div>
    </div></div>`;
  }

  // ---------- toast ----------
  let toastTimer = null, toastAction = null;
  function toast(msg, action) {
    const root = $('#toast-root');
    toastAction = action ? action.fn : null;
    root.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action ? `<button type="button" class="toast-btn" data-act="toast-action">${esc(action.label)}</button>` : ''}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { root.innerHTML = ''; toastAction = null; }, action ? 8000 : 3800);
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('button, [data-act="close-bg"]');
    if (!t) return;
    const d = t.dataset;
    if (d.act === 'close-bg') { if (e.target === t) { S.form = null; renderForm(); } return; }
    if (d.add) return openForm(d.add, d.baby);
    if (d.bset) return openSettings(d.bset);
    if (d.tab) {
      S.tab = d.tab; lsSet('futago-tab', S.tab); applyTab(); window.scrollTo(0, 0);
      // The timetable opens at the いま line rather than at 12 hours ago.
      if (S.tab === 'plan') { renderPlan(); const line = $('.plan-now'); if (line) line.scrollIntoView({ block: 'center' }); }
      return;
    }
    if (d.iostimer) return setIphoneTimer(d.iostimer);
    if (d.int) {
      const [id, h] = d.int.split(':'), input = document.getElementById(`s-${id}-int`);
      if (input) input.value = h;
      t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
      return;
    }
    if (d.edit) { const l = S.logs.find(x => x.id === d.edit); if (l) openForm(l.type, l.baby, l); return; }
    if (d.filter) {
      S.filter = d.filter;
      document.querySelectorAll('#filter button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.filter === S.filter)));
      return renderTimeline();
    }
    if (d.ring) {
      const id = d.baby;
      if (d.ring === 'stop') ack(id);
      else if (d.ring === 'snooze') S.alarm.snooze[id] = Date.now() + 5 * MIN;
      else if (d.ring === 'record') { S.alarm.snooze[id] = Date.now() + 3 * MIN; S.ringing = S.ringing.filter(x => x !== id); renderRing(); openForm('milk', id); return; }
      S.ringing = S.ringing.filter(x => x !== id); renderRing(); return;
    }
    switch (d.act) {
      case 'signin': return signIn();
      case 'signout': return signOut();
      case 'alarm-on': return alarmOn(true);
      case 'alarm-toggle':
        // Turning on is one tap; turning off goes through 設定 so a sleepy tap can't silence it.
        if (S.alarm.active) return openSettings();
        alarmOn(true); toast('アラームをオンにしました。この画面を開いたままにしてください'); return;
      case 'alarm-off': return alarmOff();
      case 'test': ensureAudio(); chime(); return;
      case 'toast-action': {
        const fn = toastAction; toastAction = null; clearTimeout(toastTimer); $('#toast-root').innerHTML = '';
        if (fn) fn();
        return;
      }
      case 'shortcut-help': return openShortcutHelp(null);
      case 'shortcut-ready': {
        lsSet('futago-shortcut-ready', true);
        const id = S.form && S.form.baby; S.form = null; renderForm();
        if (id) setIphoneTimer(id);
        return;
      }
      case 'more': S.daysShown += 7; return renderTimeline();
      case 'wmore': S.wShown += 20; return renderWeights();
      case 'close': S.form = null; return renderForm();
      case 'delete': readForm(); S.form.confirmDelete = true; return renderForm();
      case 'delete-no': readForm(); S.form.confirmDelete = false; return renderForm();
      case 'delete-yes': {
        const id = S.form.editing;
        deleteLog(id).then(() => { S.form = null; renderForm(); toast('記録を削除しました'); }).catch(err => toast(errMsg(err)));
        return;
      }
    }
    if (!S.form || S.form.type === 'settings') return;
    if (d.who) { readForm(); S.form.baby = d.who; return renderForm(); }
    if (d.kind) { readForm(); S.form.kind = d.kind; return renderForm(); }
    if (d.color) { readForm(); S.form.color = d.color; return renderForm(); }
    if (d.amount) { readForm(); S.form.amount = d.amount; return renderForm(); }
    if (d.ml) { readForm(); S.form.ml = Number(d.ml); return renderForm(); }
    if (d.ago !== undefined) { readForm(); S.form.at = Date.now() - Number(d.ago) * MIN; return renderForm(); }
    if (d.step) {
      readForm(); const [k, n] = d.step.split(':');
      S.form[k] = Math.max(0, (Number(S.form[k]) || 0) + Number(n)); return renderForm();
    }
  });
  document.addEventListener('submit', e => {
    if (e.target.id !== 'sheet') return;
    e.preventDefault();
    if (S.form && S.form.type === 'settings') submitSettings(); else submitForm();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.form) { S.form = null; renderForm(); } });
  $('#open-settings').addEventListener('click', () => openSettings());

  applyTab();
  render();
  init();
})();
</script>
</body>
</html>
